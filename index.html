<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Abacus4You</title>
<style>
/* ── CSS VARS ── */
:root{
  --bg:#08090e;--surf:#0f1117;--card:#13161f;--card2:#181c28;
  --b1:#1e2235;--b2:#252b3d;
  --acc:#00e5a0;--acc2:#00b87a;--accg:rgba(0,229,160,.18);
  --blue:#4b8ef0;--red:#e63946;
  --gold:#f0a500;--gold3:#c07800;
  --tx:#eef0f8;--txm:#7a82a0;--txs:#b0b8d0;
}
body.light{
  --bg:#e4f2fc;--surf:#fff;--card:#cce6f8;--card2:#b8d8f4;
  --b1:#90caf9;--b2:#64b5f6;
  --acc:#1565c0;--acc2:#0d47a1;--accg:rgba(21,101,192,.14);
  --blue:#1565c0;--red:#c62828;
  --tx:#0a1f3d;--txm:#3a6186;--txs:#1a4a7a;
}
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100vh;overflow-x:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit;outline:none}
svg{display:block;touch-action:manipulation}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:9px}

/* ── HEADER ── */
#hdr{
  position:sticky;top:0;z-index:100;height:54px;
  background:rgba(8,9,14,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--b1);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
}
body.light #hdr{background:rgba(255,255,255,.97)}
.logo{display:flex;align-items:center;gap:10px}
.logo-ic{width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc),var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-nm{font-weight:900;font-size:15px;line-height:1.15}
.logo-nm .a{color:var(--acc)}.logo-nm .b{color:var(--tx)}
.logo-sb{font-size:8px;color:var(--txm);letter-spacing:1.5px;text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:10px}
/* toggle */
.tgl{width:50px;height:26px;border-radius:99px;background:var(--card2);
  border:1.5px solid var(--b2);position:relative;cursor:pointer;flex-shrink:0;transition:background .3s}
.tgl-k{width:20px;height:20px;border-radius:50%;position:absolute;top:2px;left:26px;
  transition:left .28s,background .28s;font-size:12px;
  display:flex;align-items:center;justify-content:center;background:#f0a500}
body.light .tgl-k{left:2px;background:#1565c0}
body.light .tgl{background:#b8d8f4;border-color:#64b5f6}
.join-btn{background:var(--acc);color:#000;border-radius:99px;
  padding:7px 16px;font-weight:700;font-size:12px;white-space:nowrap}
body.light .join-btn{color:#fff}
.join-btn:active{transform:scale(.95)}

/* ── PAGE WRAPPER ── */
#page{
  width:100%;max-width:1200px;margin:0 auto;
  padding:12px 12px 32px;
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
/* tablet: side by side, 40/60 split */
@media(min-width:700px){
  #page{grid-template-columns:360px 1fr;padding:16px 20px 36px;gap:16px}
}
/* large desktop: wider left panel */
@media(min-width:1100px){
  #page{grid-template-columns:400px 1fr;padding:20px 28px 40px;gap:20px}
}

/* ── LEFT COL ── */
#lcol{display:flex;flex-direction:column;gap:10px}

/* ── CURRENT VALUE CARD ── */
#cvcard{
  background:linear-gradient(145deg,rgba(0,229,160,.08) 0%,rgba(75,142,240,.05) 100%);
  border:1px solid rgba(0,229,160,.25);border-radius:18px;padding:18px 16px;
  position:relative;overflow:hidden;cursor:text;user-select:none;
  transition:border-color .25s,box-shadow .25s;
}
#cvcard:focus-within,#cvcard.active{
  border-color:rgba(0,229,160,.5);
  box-shadow:0 0 0 3px rgba(0,229,160,.1);
}
body.light #cvcard{
  background:linear-gradient(145deg,rgba(21,101,192,.07),rgba(100,181,246,.05));
  border-color:rgba(21,101,192,.3);
}
body.light #cvcard:focus-within,body.light #cvcard.active{
  border-color:rgba(21,101,192,.6);box-shadow:0 0 0 3px rgba(21,101,192,.1);
}
#cvcard::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 15% 15%,rgba(0,229,160,.07),transparent 50%)}
/* hidden input */
#hi{position:fixed;opacity:0;width:1px;height:1px;top:-999px;left:-999px;
  border:none;background:transparent;color:transparent;font-size:16px;
  pointer-events:none;z-index:-99;caret-color:transparent}
.cv-lbl{font-size:10px;font-weight:700;color:var(--acc2);
  letter-spacing:1.8px;text-transform:uppercase;margin-bottom:8px;opacity:.9}
/* expression bar — now clearly visible */
#exprbar{
  display:none;
  background:rgba(0,229,160,.08);
  border:1px solid rgba(0,229,160,.2);
  border-radius:10px;padding:8px 14px;margin-bottom:8px;
  font-size:14px;font-family:'Courier New',monospace;
  color:var(--acc);opacity:.85;
  text-align:right;word-break:break-all;line-height:1.5;
  letter-spacing:.5px;
}
body.light #exprbar{
  background:rgba(21,101,192,.08);border-color:rgba(21,101,192,.25);color:var(--acc);
}
#exprbar.show{display:block}
/* big number */
#ndsp{
  font-size:clamp(40px,8vw,64px);font-weight:900;
  font-family:'Courier New',monospace;color:var(--acc);
  letter-spacing:2px;text-align:center;word-break:break-all;
  text-shadow:0 0 32px var(--accg);
  min-height:72px;display:flex;align-items:center;justify-content:center;
  line-height:1.1;margin-bottom:4px;border-radius:10px;
  transition:box-shadow .2s;
}
#ndsp.focused{box-shadow:0 0 0 2px rgba(0,229,160,.35)}
body.light #ndsp.focused{box-shadow:0 0 0 2px rgba(21,101,192,.35)}
#ndsp.pop{animation:pop .22s cubic-bezier(.4,0,.2,1)}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.065)}}
/* blinking cursor when active */
#ndsp.focused::after{content:'|';display:inline-block;
  color:var(--acc);animation:blink .85s step-end infinite;margin-left:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
/* tap hint */
.hint{font-size:10px;color:var(--txm);text-align:center;margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;gap:5px}
/* copy/clear */
.ccrow{display:flex;gap:8px;margin-bottom:10px}
.ccbtn{flex:1;border-radius:10px;padding:10px 8px;font-size:12px;font-weight:700;
  letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.cpb{background:rgba(0,229,160,.14);border:1px solid rgba(0,229,160,.3);color:var(--acc)}
body.light .cpb{background:rgba(21,101,192,.1);border-color:rgba(21,101,192,.3);color:var(--acc)}
.cpb:active{background:rgba(0,229,160,.28)}
body.light .cpb:active{background:rgba(21,101,192,.22)}
.clb{background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.28);color:var(--red)}
.clb:active{background:rgba(230,57,70,.26)}
/* place info */
.pinfo{font-size:10px;color:var(--txm);text-align:center;
  border-top:1px solid var(--b1);padding-top:8px;line-height:1.65}
.pinfo b{color:var(--acc);font-weight:700}

/* ── OPERATOR STRIP ── */
#opstrip{
  background:var(--card);border:1px solid var(--b2);
  border-radius:14px;padding:10px;
  display:grid;grid-template-columns:repeat(7,1fr);gap:6px;
}
.opbtn{
  height:46px;border-radius:9px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--b2);transition:all .13s;
}
.opbtn:active{transform:scale(.9)}
.ob-ac{background:rgba(230,57,70,.13);color:var(--red);border-color:rgba(230,57,70,.28);font-size:13px}
.ob-ac:active{background:rgba(230,57,70,.28)}
.ob-bs{background:var(--card2);color:var(--txs);font-size:17px}
.ob-bs:active{background:var(--b2)}
.ob-op{background:rgba(0,229,160,.12);color:var(--acc);border-color:rgba(0,229,160,.22);font-size:18px}
body.light .ob-op{background:rgba(21,101,192,.1);color:var(--acc);border-color:rgba(21,101,192,.25)}
.ob-op:active{background:rgba(0,229,160,.26)}
body.light .ob-op:active{background:rgba(21,101,192,.22)}
.ob-eq{background:var(--acc);color:#000;border-color:var(--acc2);font-size:18px}
body.light .ob-eq{color:#fff}
.ob-eq:active{filter:brightness(1.1)}

/* ── RIGHT COL ── */
#rcol{display:flex;flex-direction:column;gap:8px}
.ahdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.atitle{font-size:13px;font-weight:700;color:var(--txs);display:flex;align-items:center;gap:6px}
.ainfo{font-size:11px;color:var(--txm)}.ainfo b{color:var(--gold);font-weight:700}
#plbls{display:flex;width:100%;margin-bottom:2px}
.plbl{flex:1;text-align:center;font-weight:700;overflow:hidden}
#awrap{border-radius:14px;overflow:hidden;box-shadow:0 6px 28px rgba(0,0,0,.4)}
/* rod controls */
#rodctrl{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px}
.rclbl{font-size:10px;font-weight:700;color:var(--txm);letter-spacing:1px;text-transform:uppercase}
.rbtn{background:var(--card2);border:1px solid var(--b2);color:var(--txs);
  border-radius:7px;padding:4px 11px;font-size:11px;font-weight:700;transition:all .13s}
.rbtn:hover{border-color:var(--gold);color:var(--gold)}
.rbtn.sel{background:var(--gold3);border-color:var(--gold);color:#000}
.rbtn:active{transform:scale(.94)}
.stpr{display:flex;align-items:center;border:1px solid var(--b2);border-radius:7px;overflow:hidden}
.sb{background:var(--card2);color:var(--txs);width:27px;height:27px;font-size:15px;font-weight:700;border:none}
.sb:hover{background:var(--acc2);color:#fff}
.sn{background:var(--card);color:var(--tx);width:32px;height:27px;text-align:center;
  border:none;border-left:1px solid var(--b2);border-right:1px solid var(--b2);
  font-size:11px;font-weight:700;font-family:monospace}
/* quick row */
.qrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.qlbl{font-size:10px;font-weight:700;color:var(--txm);letter-spacing:1px;align-self:center}
.qbtn{background:var(--card2);border:1px solid var(--b2);color:var(--txs);
  border-radius:7px;padding:4px 9px;font-size:11px;font-family:monospace;transition:all .13s}
.qbtn:active{background:var(--acc);color:#000;border-color:var(--acc)}
body.light .qbtn:active{color:#fff}

/* ── TOAST ── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(24px);
  background:var(--acc);color:#000;border-radius:99px;padding:9px 22px;
  font-size:12px;font-weight:700;opacity:0;transition:all .28s;pointer-events:none;z-index:999}
body.light #toast{color:#fff}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
  <div class="logo">
    <div class="logo-ic">🧮</div>
    <div>
      <div class="logo-nm"><span class="a">Abacus</span><span class="b">4You</span></div>
      <div class="logo-sb">Training Platform</div>
    </div>
  </div>
  <div class="hdr-r">
    <div class="tgl" id="tgl"><div class="tgl-k" id="tglk">🌙</div></div>
    <button class="join-btn">Join Free</button>
  </div>
</div>

<!-- PAGE GRID -->
<div id="page">

  <!-- LEFT: Value + Operators -->
  <div id="lcol">

    <!-- Current Value Card -->
    <div id="cvcard" onclick="openKb()">
      <input id="hi" type="text" inputmode="numeric" autocomplete="off"
             autocorrect="off" spellcheck="false">
      <div class="cv-lbl">Current Value</div>
      <div id="exprbar"></div>
      <div id="ndsp">0</div>
      <div class="hint">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
        Tap to type number · supports + − × ÷
      </div>
      <div class="ccrow">
        <button class="ccbtn cpb" onclick="event.stopPropagation();doCopy()">📋 Copy</button>
        <button class="ccbtn clb" onclick="event.stopPropagation();doClr()">✕ Clear</button>
      </div>
      <div class="pinfo" id="pinfo"><b>0</b> — Zero</div>
    </div>

    <!-- Operator Strip: AC ⌫ + − × ÷ = -->
    <div id="opstrip">
      <button class="opbtn ob-ac" onclick="doClr()">AC</button>
      <button class="opbtn ob-bs" onclick="doBs()">⌫</button>
      <button class="opbtn ob-op" onclick="doOp('+')">+</button>
      <button class="opbtn ob-op" onclick="doOp('-')">−</button>
      <button class="opbtn ob-op" onclick="doOp('*')">×</button>
      <button class="opbtn ob-op" onclick="doOp('/')">÷</button>
      <button class="opbtn ob-eq" onclick="doEq()">=</button>
    </div>

  </div><!-- /lcol -->

  <!-- RIGHT: Abacus -->
  <div id="rcol">
    <div class="ahdr">
      <div class="atitle">🧮 Soroban Abacus</div>
      <div class="ainfo">Rods: <b id="rlbl">13</b> · Tap beads to toggle</div>
    </div>
    <div id="plbls"></div>
    <div id="awrap">
      <svg id="asvg" viewBox="0 0 400 240" width="100%" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="rodctrl">
      <span class="rclbl">Rods:</span>
      <button class="rbtn" data-r="5">5</button>
      <button class="rbtn" data-r="7">7</button>
      <button class="rbtn" data-r="9">9</button>
      <button class="rbtn sel" data-r="13">13</button>
      <button class="rbtn" data-r="17">17</button>
      <div class="stpr">
        <button class="sb" id="rdec">−</button>
        <input class="sn" id="rcnt" type="number" min="3" max="21" value="13">
        <button class="sb" id="rinc">+</button>
      </div>
    </div>
    <div class="qrow">
      <span class="qlbl">QUICK:</span>
      <button class="qbtn" data-n="1">1</button>
      <button class="qbtn" data-n="5">5</button>
      <button class="qbtn" data-n="9">9</button>
      <button class="qbtn" data-n="15">15</button>
      <button class="qbtn" data-n="45">45</button>
      <button class="qbtn" data-n="99">99</button>
      <button class="qbtn" data-n="123">123</button>
      <button class="qbtn" data-n="999">999</button>
      <button class="qbtn" data-n="9999">9,999</button>
      <button class="qbtn" data-n="99999">99,999</button>
      <button class="qbtn" data-n="1234567">12,34,567</button>
    </div>
  </div><!-- /rcol -->

</div><!-- /page -->

<div id="toast">✓ Copied!</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let RODS=13, dark=true, lastN=0;
let abacus=mkInit();
let expr='', cur='', evaled=false;

const ALLLBLS=["TKB","KB","TAB","AB","TCr","Cr","TL","L","TTh","Th","H","T","O",
               "Ten-Q","Q","Ten-P","P","Ten-O2","O2","O3","O4"];
const PNAMES={O:"Ones",T:"Tens",H:"Hundreds",Th:"Thousands",TTh:"Ten Thousands",
  L:"Lakhs",TL:"Ten Lakhs",Cr:"Crores",TCr:"Ten Crores",AB:"Arabs",TAB:"Ten Arabs",
  KB:"Kharabs",TKB:"Ten Kharabs"};

// ── ABACUS CORE ────────────────────────────────────────────────────────────
function mkInit(){return Array.from({length:RODS},()=>({h:false,e:[false,false,false,false]}))}
function cv(c){return(c.h?5:0)+c.e.filter(Boolean).length}
function abTot(){let t=0;for(let i=0;i<RODS;i++)t+=cv(abacus[i])*Math.pow(10,RODS-1-i);return t}
function n2a(n){
  const s=mkInit();if(!isFinite(n)||n<0)return s;
  n=Math.min(Math.floor(Math.abs(n)),Math.pow(10,RODS)-1);
  const str=String(n).padStart(RODS,"0");
  for(let i=0;i<RODS;i++){
    const d=parseInt(str[i]);s[i].h=d>=5;
    const ev=d%5;for(let j=0;j<ev;j++)s[i].e[j]=true;
  }
  return s;
}
function getLabels(){
  const a=ALLLBLS;
  if(RODS<=a.length)return a.slice(a.length-RODS);
  return Array.from({length:RODS-a.length},(_,i)=>`R${i+1}`).concat(a);
}
function placeText(n){
  if(n===0)return`<b>0</b> — Zero`;
  const lb=getLabels(),ds=String(Math.floor(Math.abs(n))).padStart(RODS,"0");
  const parts=[];
  lb.forEach((l,i)=>{if(parseInt(ds[i])>0&&PNAMES[l])parts.push(`<b>${parseInt(ds[i])}</b> ${PNAMES[l]}`)});
  return parts.length?parts.slice(-4).join(" + "):`<b>${n.toLocaleString('en-IN')}</b>`;
}

// ── DISPLAY ────────────────────────────────────────────────────────────────
function setNumber(n){
  n=Math.round(Math.abs(n));abacus=n2a(n);refreshDisplay(n);buildSVG();
}
function refreshDisplay(n){
  const nd=document.getElementById('ndsp');
  const pi=document.getElementById('pinfo');
  const eb=document.getElementById('exprbar');
  const num=Number.isFinite(n)?Math.round(n):0;
  if(nd){
    nd.textContent=num.toLocaleString('en-IN');
    if(num!==lastN){nd.classList.remove('pop');void nd.offsetWidth;nd.classList.add('pop');lastN=num}
  }
  if(pi)pi.innerHTML=placeText(num);
  if(eb){
    if(expr){
      eb.classList.add('show');
      eb.textContent=(expr+cur).replace(/\*/g,'×').replace(/\//g,'÷');
    } else {
      eb.classList.remove('show');eb.textContent='';
    }
  }
}

// ── NATIVE KEYBOARD (mobile) ───────────────────────────────────────────────
const hi=document.getElementById('hi');
let kbOpen=false;

function openKb(){
  // Make briefly visible/focusable to trigger native keyboard
  hi.style.position='fixed';hi.style.top='40%';hi.style.left='50%';
  hi.style.width='1px';hi.style.height='1px';hi.style.opacity='0.01';
  hi.style.pointerEvents='auto';hi.removeAttribute('readonly');
  hi.focus();
  document.getElementById('ndsp').classList.add('focused');
  document.getElementById('cvcard').classList.add('active');
  kbOpen=true;
  setTimeout(()=>{
    hi.style.position='fixed';hi.style.top='-999px';hi.style.left='-999px';
    hi.style.pointerEvents='none';
  },400);
}
hi.addEventListener('focus',()=>{
  document.getElementById('ndsp').classList.add('focused');
  document.getElementById('cvcard').classList.add('active');
});
hi.addEventListener('blur',()=>{
  document.getElementById('ndsp').classList.remove('focused');
  document.getElementById('cvcard').classList.remove('active');
  kbOpen=false;
});
hi.addEventListener('input',e=>{
  const v=hi.value;hi.value='';
  if(v){
    const last=v[v.length-1];
    if('0123456789'.includes(last))kbNum(last);
    else if(last==='.')kbNum('.');
  }
});

// ── CALC LOGIC ─────────────────────────────────────────────────────────────
function kbNum(ch){
  if(evaled){expr='';cur='';evaled=false}
  if(ch==='.'&&cur.includes('.'))return;
  if(ch!=='.'&&cur==='0')cur='';
  cur+=ch;
  setNumber(parseFloat(cur)||0);
  refreshDisplay(parseFloat(cur)||0);
}
function doOp(op){
  evaled=false;
  if(cur!==''){expr+=cur+op;cur='';}
  else if(expr.length>0){expr=expr.replace(/[+\-*\/]$/,'')+op;}
  else{expr='0'+op;}
  refreshDisplay(lastN);
}
function doEq(){
  if(!expr&&!cur)return;
  const full=expr+(cur||'0');
  let res;
  try{res=Function('"use strict";return('+full.replace(/[^0-9+\-*\/\.]/g,'')+')')();}
  catch(e){res=0}
  if(!isFinite(res))res=0;
  expr='';cur=String(Math.round(res));evaled=true;
  setNumber(res);refreshDisplay(res);
}
function doBs(){
  if(evaled){doClr();return}
  if(cur.length>0){cur=cur.slice(0,-1);const n=parseFloat(cur)||0;setNumber(n);refreshDisplay(n);}
  else if(expr.length>0){expr=expr.slice(0,-1);refreshDisplay(lastN);}
}
function doClr(){
  expr='';cur='';evaled=false;abacus=mkInit();refreshDisplay(0);buildSVG();
}

// ── BEAD TOGGLE ────────────────────────────────────────────────────────────
function togH(ci){
  abacus[ci].h=!abacus[ci].h;
  const n=abTot();expr='';cur=String(n);evaled=false;refreshDisplay(n);buildSVG();
}
function togE(ci,bi){
  const e=abacus[ci].e,ac=e.filter(Boolean).length,nc=(ac===bi+1)?bi:bi+1;
  for(let j=0;j<4;j++)e[j]=j<nc;
  const n=abTot();expr='';cur=String(n);evaled=false;refreshDisplay(n);buildSVG();
}

// ── PHYSICAL KEYBOARD ──────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.target===hi)return;
  if('0123456789'.includes(e.key))kbNum(e.key);
  else if(e.key==='+')doOp('+');
  else if(e.key==='-')doOp('-');
  else if(e.key==='*')doOp('*');
  else if(e.key==='/'){e.preventDefault();doOp('/');}
  else if(e.key==='Enter'||e.key==='=')doEq();
  else if(e.key==='Backspace')doBs();
  else if(e.key==='Escape')doClr();
});

// ── SVG ABACUS ─────────────────────────────────────────────────────────────
function buildSVG(){
  const wrap=document.getElementById('awrap');
  const W=Math.max(260,wrap.offsetWidth||360);
  const SH=240,DIVH=80,BARH=11;
  const colW=W/RODS;
  const bRx=Math.max(6,Math.min(colW*.41,21));
  const bRy=Math.max(4,Math.min(colW*.245,13));
  const bGap=bRy*2+1.2; // tight

  const hInY=13+bRy, hAcY=DIVH-bRy-2;
  const ezT=DIVH+BARH+2, ezB=SH-12;

  const lgt=document.body.classList.contains('light');
  const bIF="#f4d03f",bIS="#c4a000";
  const bAF=lgt?"#1565c0":"#00e5a0",bAS=lgt?"#0d47a1":"#00b87a";
  const bAG=lgt?"rgba(21,101,192,.5)":"rgba(0,229,160,.5)";
  const dAC=lgt?"#1565c0":"#00e5a0";

  let s='';
  s+=`<rect x="0" y="0" width="${W}" height="${SH}" rx="13" fill="#5c3a00"/>`;
  s+=`<rect x="5" y="5" width="${W-10}" height="${SH-10}" rx="10" fill="#3d2000"/>`;
  for(let g=0;g<22;g++){const gx=-4+g*(W/15);
    s+=`<line x1="${gx}" y1="5" x2="${gx+12}" y2="${SH-5}" stroke="#fff" stroke-width="0.22" opacity="0.036"/>`;}
  s+=`<rect x="3" y="${DIVH}" width="${W-6}" height="${BARH}" rx="4" fill="#c8962e"/>`;
  s+=`<rect x="3" y="${DIVH+2}" width="${W-6}" height="2.2" rx="1" fill="#fff" opacity="0.24"/>`;
  s+=`<rect x="3" y="${DIVH+7}" width="${W-6}" height="1.5" rx="0.5" fill="#000" opacity="0.15"/>`;

  abacus.forEach((col,ci)=>{
    const x=ci*colW+colW/2;
    const hA=col.h;

    // Rods
    s+=`<line x1="${x}" y1="9" x2="${x}" y2="${DIVH}" stroke="#6b3a00" stroke-width="1.7" stroke-linecap="round"/>`;
    s+=`<line x1="${x}" y1="${DIVH+BARH}" x2="${x}" y2="${SH-9}" stroke="#6b3a00" stroke-width="1.7" stroke-linecap="round"/>`;
    s+=`<line x1="${x+.5}" y1="9" x2="${x+.5}" y2="${DIVH}" stroke="#fff" stroke-width=".4" opacity=".11" stroke-linecap="round"/>`;
    s+=`<line x1="${x+.5}" y1="${DIVH+BARH}" x2="${x+.5}" y2="${SH-9}" stroke="#fff" stroke-width=".4" opacity=".11" stroke-linecap="round"/>`;

    // Heaven bead
    const hy=hA?hAcY:hInY;
    const hF=hA?bAF:bIF,hS=hA?bAS:bIS;
    s+=`<g onclick="togH(${ci})" style="cursor:pointer">`;
    s+=`<ellipse cx="${x}" cy="${hy}" rx="${bRx}" ry="${bRy}" fill="${hF}" stroke="${hS}" stroke-width="1.1"${hA?` filter="drop-shadow(0 0 5px ${bAG})"`:''}/>`; 
    s+=`<ellipse cx="${x-bRx*.26}" cy="${hy-bRy*.38}" rx="${bRx*.23}" ry="${bRy*.2}" fill="#fff" opacity=".27" pointer-events="none"/>`;
    s+=`</g>`;

    // Earth beads (bi=0 = topmost / closest to divider)
    const inactList=[];
    for(let j=0;j<4;j++)if(!col.e[j])inactList.push(j);

    for(let bi=0;bi<4;bi++){
      const act=col.e[bi];
      let by;
      if(act){
        by=ezT+bRy+bi*bGap;
      } else {
        const idx=inactList.indexOf(bi);
        const fromBot=inactList.length-1-idx;
        by=ezB-bRy-fromBot*bGap;
      }
      const eF=act?bAF:bIF,eS=act?bAS:bIS;
      s+=`<g onclick="togE(${ci},${bi})" style="cursor:pointer">`;
      s+=`<ellipse cx="${x}" cy="${by}" rx="${bRx}" ry="${bRy}" fill="${eF}" stroke="${eS}" stroke-width="1.1"${act?` filter="drop-shadow(0 0 5px ${bAG})"`:''}/>`; 
      s+=`<ellipse cx="${x-bRx*.26}" cy="${by-bRy*.38}" rx="${bRx*.23}" ry="${bRy*.2}" fill="#fff" opacity=".27" pointer-events="none"/>`;
      s+=`</g>`;
    }

    const dv=cv(col);
    s+=`<text x="${x}" y="${SH-1.5}" text-anchor="middle" font-size="${Math.max(5,Math.min(9,colW*.3))}" font-weight="700" fill="${dv>0?dAC:'#252b3d'}">${dv}</text>`;
  });

  document.getElementById('asvg').setAttribute('viewBox',`0 0 ${W} ${SH}`);
  document.getElementById('asvg').innerHTML=s;
}

function buildLabels(){
  const lb=getLabels();
  const wrap=document.getElementById('plbls');
  const ww=wrap.offsetWidth||300;
  const fs=Math.max(5.5,Math.min(10,ww/RODS/3.6));
  let h='';
  lb.forEach((l,i)=>{
    h+=`<div class="plbl" style="font-size:${fs}px;color:${i===RODS-1?'var(--acc)':'var(--txm)'}">${l}</div>`;
  });
  wrap.innerHTML=h;
}

function setRods(r){
  r=Math.max(3,Math.min(21,r));RODS=r;abacus=mkInit();
  document.getElementById('rcnt').value=r;
  document.getElementById('rlbl').textContent=r;
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('sel',parseInt(b.dataset.r)===r));
  doClr();buildSVG();buildLabels();
}

// ── COPY ──────────────────────────────────────────────────────────────────
function doCopy(){
  const t=document.getElementById('toast');
  navigator.clipboard?.writeText(document.getElementById('ndsp').textContent).catch(()=>{});
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);
}

// ── EVENTS ────────────────────────────────────────────────────────────────
document.getElementById('tgl').addEventListener('click',()=>{
  dark=!dark;document.body.classList.toggle('light',!dark);
  document.getElementById('tglk').textContent=dark?'🌙':'☀️';buildSVG();
});
document.querySelectorAll('.rbtn').forEach(b=>b.addEventListener('click',()=>setRods(parseInt(b.dataset.r))));
document.getElementById('rdec').addEventListener('click',()=>setRods(RODS-1));
document.getElementById('rinc').addEventListener('click',()=>setRods(RODS+1));
document.getElementById('rcnt').addEventListener('change',e=>setRods(parseInt(e.target.value)||13));
document.querySelectorAll('.qbtn').forEach(b=>b.addEventListener('click',()=>{
  const n=parseInt(b.dataset.n);expr='';cur=String(n);evaled=false;setNumber(n);refreshDisplay(n);
}));
let rsz;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{buildSVG();buildLabels();},80)});

// ── INIT ──────────────────────────────────────────────────────────────────
refreshDisplay(0);buildSVG();buildLabels();
</script>
