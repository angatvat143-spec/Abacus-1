<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Abacus4You</title>
<style>
:root{
  --bg:#08090e;--card:#13161f;--card2:#181c28;
  --b1:#1e2235;--b2:#252b3d;
  --acc:#00e5a0;--acc2:#00b87a;--accg:rgba(0,229,160,.22);
  --blue:#4b8ef0;--red:#e63946;
  --gold:#f0a500;--gold3:#c07800;
  --tx:#eef0f8;--txm:#7a82a0;--txs:#b0b8d0;
}
body.light{
  --bg:#e4f2fc;--card:#cce6f8;--card2:#b8d8f4;
  --b1:#90caf9;--b2:#64b5f6;
  --acc:#1565c0;--acc2:#0d47a1;--accg:rgba(21,101,192,.15);
  --blue:#1565c0;--red:#c62828;
  --tx:#0a1f3d;--txm:#3a6186;--txs:#1a4a7a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--tx);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit;outline:none}
svg{display:block}

/* ══ HEADER ══ */
#hdr{
  position:relative;z-index:10;
  height:50px;flex-shrink:0;
  background:rgba(8,9,14,.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--b1);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;
}
body.light #hdr{background:rgba(255,255,255,.97)}
.logo{display:flex;align-items:center;gap:9px}
.logo-ic{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc),var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.logo-nm{font-weight:900;font-size:14px;line-height:1.1}
.logo-nm .a{color:var(--acc)}.logo-nm .b{color:var(--tx)}
.logo-sb{font-size:8px;color:var(--txm);letter-spacing:1.2px;text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:8px}
.tgl{
  width:46px;height:24px;border-radius:99px;
  background:var(--card2);border:1.5px solid var(--b2);
  position:relative;cursor:pointer;flex-shrink:0;
}
.tgl-k{
  width:18px;height:18px;border-radius:50%;
  position:absolute;top:2px;left:24px;
  transition:left .26s,background .26s;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;background:#f0a500;
}
body.light .tgl-k{left:2px;background:#1565c0}
body.light .tgl{background:#b8d8f4;border-color:#64b5f6}
.join-btn{
  background:var(--acc);color:#000;border-radius:99px;
  padding:6px 14px;font-weight:700;font-size:12px;white-space:nowrap;
  transition:transform .15s;
}
body.light .join-btn{color:#fff}
.join-btn:active{transform:scale(.94)}

/* ══ BODY WRAPPER ══ */
#wrap{
  /* fills remaining viewport below header */
  position:fixed;
  top:50px;left:0;right:0;bottom:0;
  display:flex;
  overflow:hidden;
}

/* ══ MOBILE: single column ══ */
#lcol{
  display:flex;flex-direction:column;
  width:100%;height:100%;
  padding:8px 8px 6px;
  gap:7px;
  overflow:hidden;
}
/* ══ DESKTOP: two column ══ */
@media(min-width:680px){
  #lcol{
    width:300px;flex-shrink:0;
    border-right:1px solid var(--b1);
    padding:12px 12px 10px;
    gap:8px;
  }
  #rcol{
    flex:1;min-width:0;
    display:flex!important;
    flex-direction:column;
    padding:10px 14px 10px;
    gap:6px;
    overflow:hidden;
  }
}
@media(min-width:1000px){
  #lcol{width:340px;padding:14px 14px 12px}
  #rcol{padding:12px 20px 12px}
}
@media(min-width:1280px){
  #lcol{width:380px}
}

/* Desktop: rcol hidden on mobile */
#rcol{display:none;height:100%}

/* ══ CURRENT VALUE CARD ══ */
#cvcard{
  flex-shrink:0;
  background:linear-gradient(145deg,rgba(0,229,160,.08),rgba(75,142,240,.05));
  border:1px solid rgba(0,229,160,.22);
  border-radius:14px;padding:11px 14px 9px;
  position:relative;overflow:hidden;cursor:text;user-select:none;
  transition:border-color .2s,box-shadow .2s;
}
#cvcard.active{
  border-color:rgba(0,229,160,.5);
  box-shadow:0 0 0 3px rgba(0,229,160,.08);
}
body.light #cvcard{
  background:linear-gradient(145deg,rgba(21,101,192,.07),rgba(100,181,246,.05));
  border-color:rgba(21,101,192,.28);
}
body.light #cvcard.active{
  border-color:rgba(21,101,192,.55);
  box-shadow:0 0 0 3px rgba(21,101,192,.08);
}
#cvcard::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 15% 15%,rgba(0,229,160,.07),transparent 50%);
}
#hi{
  position:fixed;top:-9999px;left:-9999px;
  width:1px;height:1px;opacity:0;border:none;
  background:transparent;font-size:16px;
  pointer-events:none;z-index:-1;
  color:transparent;caret-color:transparent;
}
.cv-lbl{
  font-size:9px;font-weight:700;color:var(--acc2);
  letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;opacity:.85;
}
#exprline{
  font-size:11px;font-family:'Courier New',monospace;
  color:var(--acc);opacity:.55;
  letter-spacing:.4px;text-align:right;
  min-height:14px;line-height:1.2;
  word-break:break-all;transition:opacity .2s;
}
#exprline:empty{opacity:0;min-height:0}
#ndsp{
  font-size:clamp(34px,6vw,52px);font-weight:900;
  font-family:'Courier New',monospace;color:var(--acc);
  letter-spacing:2px;text-shadow:0 0 28px var(--accg);
  text-align:center;word-break:break-all;line-height:1.1;
  transition:transform .15s;
}
#ndsp.pop{animation:popN .2s cubic-bezier(.4,0,.2,1)}
@keyframes popN{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#ndsp.focused::after{
  content:'|';display:inline-block;color:var(--acc);
  animation:blink .85s step-end infinite;margin-left:1px;font-size:.65em;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pinfo{
  font-size:9px;color:var(--txm);text-align:center;
  border-top:1px solid var(--b1);padding-top:5px;margin-top:5px;
  line-height:1.5;
}
.pinfo b{color:var(--acc);font-weight:700}

/* ══ NUMBER ROW ══ */
#numrow{
  flex-shrink:0;
  background:var(--card);border:1px solid var(--b2);
  border-radius:11px;padding:6px;
  display:grid;grid-template-columns:repeat(10,1fr);gap:5px;
}
/* ══ OP ROW ══ */
#oprow{
  flex-shrink:0;
  background:var(--card);border:1px solid var(--b2);
  border-radius:11px;padding:6px;
  display:grid;grid-template-columns:repeat(7,1fr);gap:5px;
}
.kb{
  height:42px;border-radius:8px;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--b2);
  transition:transform .1s,filter .1s;
  position:relative;overflow:hidden;
}
.kb:active{transform:scale(.88)!important}
/* ripple */
.kb::after{
  content:'';position:absolute;inset:0;border-radius:8px;
  background:rgba(255,255,255,.1);
  opacity:0;transition:opacity .15s;
}
.kb:active::after{opacity:1}
.kn{background:var(--card2);color:var(--tx)}
.kn:hover{background:var(--b2)}
.ko{background:rgba(0,229,160,.12);color:var(--acc);border-color:rgba(0,229,160,.2);font-size:17px}
body.light .ko{background:rgba(21,101,192,.1);color:var(--acc);border-color:rgba(21,101,192,.2)}
.ko:hover{filter:brightness(1.15)}
.keq{background:var(--acc);color:#000;border-color:var(--acc2);font-size:17px}
body.light .keq{color:#fff}
.keq:hover{filter:brightness(1.1)}
.kac{background:rgba(230,57,70,.13);color:var(--red);border-color:rgba(230,57,70,.25);font-size:12px}
.kac:hover{background:rgba(230,57,70,.22)}
.kbs{background:var(--card2);color:var(--txs);font-size:16px}
.kbs:hover{background:var(--b2)}

/* ══ MOBILE ABACUS (inside lcol) ══ */
#mob-abacus{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  gap:4px;overflow:hidden;
}
@media(min-width:680px){
  #mob-abacus{display:none}
}
.ahdr{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px;
}
.atitle{font-size:11px;font-weight:700;color:var(--txs);display:flex;align-items:center;gap:5px}
.ainfo{font-size:10px;color:var(--txm)}.ainfo b{color:var(--gold);font-weight:700}
#mob-plbls,#dsk-plbls{display:flex;width:100%;margin-bottom:2px;flex-shrink:0}
.plbl{flex:1;text-align:center;font-weight:700;overflow:hidden}
#mob-awrap{
  flex:1;min-height:0;
  border-radius:11px;overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.45);
}
#mob-asvg{width:100%;height:100%}

/* rod controls */
#mob-rodctrl,#dsk-rodctrl{
  flex-shrink:0;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
}
.rclbl{font-size:9px;font-weight:700;color:var(--txm);letter-spacing:.8px;text-transform:uppercase}
.rbtn{
  background:var(--card2);border:1px solid var(--b2);color:var(--txs);
  border-radius:6px;padding:3px 9px;font-size:10px;font-weight:700;
  transition:all .12s;
}
.rbtn:hover{border-color:var(--gold);color:var(--gold)}
.rbtn.sel{background:var(--gold3);border-color:var(--gold);color:#000}
.rbtn:active{transform:scale(.9)}
.stpr{display:flex;align-items:center;border:1px solid var(--b2);border-radius:6px;overflow:hidden}
.sb{background:var(--card2);color:var(--txs);width:24px;height:24px;font-size:13px;font-weight:700;border:none}
.sb:hover{background:var(--acc2);color:#fff}
.sn{
  background:var(--card);color:var(--tx);width:28px;height:24px;
  text-align:center;border:none;
  border-left:1px solid var(--b2);border-right:1px solid var(--b2);
  font-size:10px;font-weight:700;font-family:monospace;
}

/* ══ DESKTOP RCOL ABACUS ══ */
.dsk-abacus{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  gap:5px;overflow:hidden;
}
#dsk-awrap{
  flex:1;min-height:0;
  border-radius:12px;overflow:hidden;
  box-shadow:0 5px 22px rgba(0,0,0,.4);
}
#dsk-asvg{width:100%;height:100%}

/* ══ BEAD ANIMATION ══ */
@keyframes beadBounce{
  0%{transform:translateY(0)}
  30%{transform:translateY(-4px)}
  60%{transform:translateY(2px)}
  100%{transform:translateY(0)}
}
.bead-anim{animation:beadBounce .25s cubic-bezier(.4,0,.2,1)}

/* ══ TOAST ══ */
#toast{
  position:fixed;bottom:16px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--acc);color:#000;border-radius:99px;
  padding:7px 18px;font-size:11px;font-weight:700;
  opacity:0;transition:all .25s;pointer-events:none;z-index:999;
}
body.light #toast{color:#fff}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
  <div class="logo">
    <div class="logo-ic">🧮</div>
    <div>
      <div class="logo-nm"><span class="a">Abacus</span><span class="b">4You</span></div>
      <div class="logo-sb">Training Platform</div>
    </div>
  </div>
  <div class="hdr-r">
    <div class="tgl" id="tgl"><div class="tgl-k" id="tglk">🌙</div></div>
    <button class="join-btn">Join Free</button>
  </div>
</div>

<!-- MAIN WRAP -->
<div id="wrap">

  <!-- LEFT COL (full width mobile, fixed width desktop) -->
  <div id="lcol">

    <!-- Value Card -->
    <div id="cvcard" onclick="openKb()">
      <input id="hi" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="cv-lbl">Current Value</div>
      <div id="exprline"></div>
      <div id="ndsp">0</div>
      <div class="pinfo" id="pinfo"><b>0</b> — Zero</div>
    </div>

    <!-- Number Row -->
    <div id="numrow">
      <button class="kb kn" onclick="kbNum('1')">1</button>
      <button class="kb kn" onclick="kbNum('2')">2</button>
      <button class="kb kn" onclick="kbNum('3')">3</button>
      <button class="kb kn" onclick="kbNum('4')">4</button>
      <button class="kb kn" onclick="kbNum('5')">5</button>
      <button class="kb kn" onclick="kbNum('6')">6</button>
      <button class="kb kn" onclick="kbNum('7')">7</button>
      <button class="kb kn" onclick="kbNum('8')">8</button>
      <button class="kb kn" onclick="kbNum('9')">9</button>
      <button class="kb kn" onclick="kbNum('0')">0</button>
    </div>

    <!-- Op Row -->
    <div id="oprow">
      <button class="kb kac" onclick="doClr()">AC</button>
      <button class="kb kbs" onclick="doBs()">⌫</button>
      <button class="kb ko"  onclick="doOp('+')">+</button>
      <button class="kb ko"  onclick="doOp('-')">−</button>
      <button class="kb ko"  onclick="doOp('*')">×</button>
      <button class="kb ko"  onclick="doOp('/')">÷</button>
      <button class="kb keq" onclick="doEq()">=</button>
    </div>

    <!-- MOBILE ABACUS (hidden on desktop) -->
    <div id="mob-abacus">
      <div class="ahdr">
        <div class="atitle">🧮 Soroban Abacus</div>
        <div class="ainfo">Rods: <b id="mob-rlbl">13</b> · Tap beads</div>
      </div>
      <div id="mob-plbls"></div>
      <div id="mob-awrap">
        <svg id="mob-asvg" preserveAspectRatio="none"></svg>
      </div>
      <div id="mob-rodctrl">
        <span class="rclbl">Rods:</span>
        <button class="rbtn" data-r="5">5</button>
        <button class="rbtn" data-r="7">7</button>
        <button class="rbtn" data-r="9">9</button>
        <button class="rbtn sel" data-r="13">13</button>
        <button class="rbtn" data-r="17">17</button>
        <div class="stpr">
          <button class="sb" onclick="setRods(RODS-1)">−</button>
          <input class="sn" id="mob-rcnt" type="number" min="3" max="21" value="13">
          <button class="sb" onclick="setRods(RODS+1)">+</button>
        </div>
      </div>
    </div>

  </div><!-- /lcol -->

  <!-- DESKTOP RIGHT COL -->
  <div id="rcol">
    <div class="dsk-abacus">
      <div class="ahdr">
        <div class="atitle">🧮 Soroban Abacus</div>
        <div class="ainfo">Rods: <b id="dsk-rlbl">13</b> · Tap beads to toggle</div>
      </div>
      <div id="dsk-plbls"></div>
      <div id="dsk-awrap">
        <svg id="dsk-asvg" preserveAspectRatio="none"></svg>
      </div>
      <div id="dsk-rodctrl">
        <span class="rclbl">Rods:</span>
        <button class="rbtn" data-r="5">5</button>
        <button class="rbtn" data-r="7">7</button>
        <button class="rbtn" data-r="9">9</button>
        <button class="rbtn sel" data-r="13">13</button>
        <button class="rbtn" data-r="17">17</button>
        <div class="stpr">
          <button class="sb" onclick="setRods(RODS-1)">−</button>
          <input class="sn" id="dsk-rcnt" type="number" min="3" max="21" value="13">
          <button class="sb" onclick="setRods(RODS+1)">+</button>
        </div>
      </div>
    </div>
  </div>

</div><!-- /wrap -->
<div id="toast">✓ Copied!</div>

<script>
// ── AUDIO CTX ────────────────────────────────────────────────────────────
let audioCtx=null;
function getAudio(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playClick(freq=700,dur=0.06){
  try{
    const C=getAudio();
    const o=C.createOscillator(),g=C.createGain();
    o.connect(g);g.connect(C.destination);
    o.type='sine';o.frequency.setValueAtTime(freq,C.currentTime);
    g.gain.setValueAtTime(0.08,C.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,C.currentTime+dur);
    o.start(C.currentTime);o.stop(C.currentTime+dur);
  }catch(e){}
}
function playBead(active){playClick(active?880:660,0.07)}
function playNum(){playClick(750,0.05)}
function playOp(){playClick(550,0.08)}
function playEq(){
  try{
    const C=getAudio();
    const freqs=[523,659,784];
    freqs.forEach((f,i)=>{
      const o=C.createOscillator(),g=C.createGain();
      o.connect(g);g.connect(C.destination);
      o.type='sine';o.frequency.value=f;
      const t=C.currentTime+i*0.08;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.07,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      o.start(t);o.stop(t+0.13);
    });
  }catch(e){}
}

// ── STATE ─────────────────────────────────────────────────────────────────
let RODS=13,dark=true,lastN=0;
let abacus=mkInit();
let expr='',cur='',evaled=false;

const ALLLBLS=["TKB","KB","TAB","AB","TCr","Cr","TL","L","TTh","Th","H","T","O",
               "Ten-Q","Q","Ten-P","P","Ten-O2","O2","O3","O4"];
const PNAMES={O:"Ones",T:"Tens",H:"Hundreds",Th:"Thousands",TTh:"Ten Thousands",
  L:"Lakhs",TL:"Ten Lakhs",Cr:"Crores",TCr:"Ten Crores",
  AB:"Arabs",TAB:"Ten Arabs",KB:"Kharabs",TKB:"Ten Kharabs"};

// ── ABACUS CORE ───────────────────────────────────────────────────────────
function mkInit(){return Array.from({length:RODS},()=>({h:false,e:[false,false,false,false]}))}
function cv(c){return(c.h?5:0)+c.e.filter(Boolean).length}
function abTot(){let t=0;for(let i=0;i<RODS;i++)t+=cv(abacus[i])*Math.pow(10,RODS-1-i);return t}
function n2a(n){
  const s=mkInit();if(!isFinite(n)||n<0)return s;
  n=Math.min(Math.floor(Math.abs(n)),Math.pow(10,RODS)-1);
  const str=String(n).padStart(RODS,"0");
  for(let i=0;i<RODS;i++){
    const d=parseInt(str[i]);s[i].h=d>=5;
    const ev=d%5;for(let j=0;j<ev;j++)s[i].e[j]=true;
  }
  return s;
}
function getLabels(){
  const a=ALLLBLS;
  if(RODS<=a.length)return a.slice(a.length-RODS);
  return Array.from({length:RODS-a.length},(_,i)=>`R${i+1}`).concat(a);
}
function placeText(n){
  if(n===0)return`<b>0</b> — Zero`;
  const lb=getLabels(),ds=String(Math.floor(Math.abs(n))).padStart(RODS,"0");
  const pts=[];
  lb.forEach((l,i)=>{if(parseInt(ds[i])>0&&PNAMES[l])pts.push(`<b>${parseInt(ds[i])}</b> ${PNAMES[l]}`)});
  return pts.length?pts.slice(-4).join(" + "):`<b>${n.toLocaleString('en-IN')}</b>`;
}

// ── DISPLAY ───────────────────────────────────────────────────────────────
function setNumber(n){
  n=Math.round(Math.abs(n));abacus=n2a(n);refreshDisplay(n);buildBoth();
}
function refreshDisplay(n){
  const nd=document.getElementById('ndsp');
  const pi=document.getElementById('pinfo');
  const el=document.getElementById('exprline');
  const num=Number.isFinite(n)?Math.round(n):0;
  if(nd){
    nd.textContent=num.toLocaleString('en-IN');
    if(num!==lastN){nd.classList.remove('pop');void nd.offsetWidth;nd.classList.add('pop');lastN=num}
  }
  if(pi)pi.innerHTML=placeText(num);
  if(el)el.textContent=expr?(expr+(cur||'')).replace(/\*/g,'×').replace(/\//g,'÷'):'';
}

// ── NATIVE KEYBOARD ───────────────────────────────────────────────────────
const hi=document.getElementById('hi');
function openKb(){
  hi.style.cssText='position:fixed;top:40%;left:50%;width:2px;height:2px;opacity:0.01;font-size:16px;border:none;background:transparent;z-index:999;pointer-events:auto;color:transparent;caret-color:transparent;outline:none';
  hi.removeAttribute('readonly');hi.focus();
  document.getElementById('ndsp').classList.add('focused');
  document.getElementById('cvcard').classList.add('active');
  setTimeout(()=>{
    hi.style.cssText='position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;font-size:16px;border:none;background:transparent;pointer-events:none;z-index:-1;color:transparent;caret-color:transparent';
  },500);
}
hi.addEventListener('focus',()=>{
  document.getElementById('ndsp').classList.add('focused');
  document.getElementById('cvcard').classList.add('active');
});
hi.addEventListener('blur',()=>{
  document.getElementById('ndsp').classList.remove('focused');
  document.getElementById('cvcard').classList.remove('active');
});
hi.addEventListener('input',()=>{
  const v=hi.value;hi.value='';
  if(v){const ch=v[v.length-1];
    if('0123456789'.includes(ch)){playNum();kbNum(ch);}
    else if(ch==='.')kbNum('.');
  }
});

// ── CALCULATOR ────────────────────────────────────────────────────────────
function kbNum(ch){
  if(evaled){expr='';cur='';evaled=false}
  if(ch==='.'&&cur.includes('.'))return;
  if(ch!=='.'&&cur==='0')cur='';
  cur+=ch;
  const n=parseFloat(cur)||0;
  setNumber(n);refreshDisplay(n);
}
function doOp(op){
  evaled=false;playOp();
  if(cur!==''){expr+=cur+op;cur='';}
  else if(expr.length>0){expr=expr.replace(/[+\-*\/]$/,'')+op;}
  else{expr='0'+op;}
  refreshDisplay(lastN);
}
function doEq(){
  if(!expr&&!cur)return;
  playEq();
  const full=expr+(cur||'0');
  let res;
  try{res=Function('"use strict";return('+full.replace(/[^0-9+\-*\/\.]/g,'')+')')();}
  catch(e){res=0}
  if(!isFinite(res))res=0;
  expr='';cur=String(Math.round(res));evaled=true;
  setNumber(res);refreshDisplay(res);
}
function doBs(){
  if(evaled){doClr();return}
  playClick(500,0.05);
  if(cur.length>0){cur=cur.slice(0,-1);const n=parseFloat(cur)||0;setNumber(n);refreshDisplay(n);}
  else if(expr.length>0){expr=expr.slice(0,-1);refreshDisplay(lastN);}
}
function doClr(){
  playClick(400,0.08);
  expr='';cur='';evaled=false;abacus=mkInit();refreshDisplay(0);buildBoth();
}

// ── BEAD TOGGLE ───────────────────────────────────────────────────────────
function togH(ci){
  abacus[ci].h=!abacus[ci].h;playBead(abacus[ci].h);
  const n=abTot();expr='';cur=String(n);evaled=false;refreshDisplay(n);buildBoth();
}
function togE(ci,bi){
  const e=abacus[ci].e,ac=e.filter(Boolean).length,nc=(ac===bi+1)?bi:bi+1;
  for(let j=0;j<4;j++)e[j]=j<nc;
  playBead(col_active(ci));
  const n=abTot();expr='';cur=String(n);evaled=false;refreshDisplay(n);buildBoth();
}
function col_active(ci){return abacus[ci].h||abacus[ci].e.some(Boolean)}

// ── PHYSICAL KEYBOARD ─────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.target===hi)return;
  if('0123456789'.includes(e.key)){playNum();kbNum(e.key);}
  else if(e.key==='+'){doOp('+')}
  else if(e.key==='-'){doOp('-')}
  else if(e.key==='*'){doOp('*')}
  else if(e.key==='/'){e.preventDefault();doOp('/');}
  else if(e.key==='Enter'||e.key==='='){doEq()}
  else if(e.key==='Backspace'){doBs()}
  else if(e.key==='Escape'){doClr()}
});

// ── SVG DRAW ──────────────────────────────────────────────────────────────
function drawSVG(svgId,W,H){
  const colW=W/RODS;
  const bRx=Math.max(5,Math.min(colW*.42,20));
  const bRy=Math.max(3.5,Math.min(colW*.255,11,H*.046));
  const bGap=bRy*2+0.8; // ultra tight

  const DIVH=Math.round(H*.33);
  const BARH=Math.max(6,Math.round(H*.042));
  const hInY=Math.round(H*.04)+bRy;
  const hAcY=DIVH-bRy-1.5;
  const ezT=DIVH+BARH+1;
  const ezB=H-Math.round(H*.04);

  const lgt=document.body.classList.contains('light');
  const bIF="#f4d03f",bIS="#c4a000";
  const bAF=lgt?"#1565c0":"#00e5a0",bAS=lgt?"#0d47a1":"#00b87a";
  const bAG=lgt?"rgba(21,101,192,.5)":"rgba(0,229,160,.5)";
  const dAC=lgt?"#1565c0":"#00e5a0";

  let s='';
  s+=`<rect x="0" y="0" width="${W}" height="${H}" rx="11" fill="#5c3a00"/>`;
  s+=`<rect x="4" y="4" width="${W-8}" height="${H-8}" rx="8" fill="#3d2000"/>`;
  for(let g=0;g<20;g++){const gx=-3+g*(W/13);
    s+=`<line x1="${gx}" y1="4" x2="${gx+10}" y2="${H-4}" stroke="#fff" stroke-width="0.18" opacity="0.033"/>`;}
  s+=`<rect x="3" y="${DIVH}" width="${W-6}" height="${BARH}" rx="3.5" fill="#c8962e"/>`;
  s+=`<rect x="3" y="${DIVH+1.5}" width="${W-6}" height="2" rx="1" fill="#fff" opacity="0.2"/>`;
  s+=`<rect x="3" y="${DIVH+BARH-2}" width="${W-6}" height="1.5" rx="0.5" fill="#000" opacity="0.14"/>`;

  abacus.forEach((col,ci)=>{
    const x=ci*colW+colW/2;
    const hA=col.h;
    const digFS=Math.max(4,Math.min(8,colW*.28));

    s+=`<line x1="${x}" y1="${H*.025}" x2="${x}" y2="${DIVH}" stroke="#6b3a00" stroke-width="1.5" stroke-linecap="round"/>`;
    s+=`<line x1="${x}" y1="${DIVH+BARH}" x2="${x}" y2="${H*.975}" stroke="#6b3a00" stroke-width="1.5" stroke-linecap="round"/>`;
    s+=`<line x1="${x+.4}" y1="${H*.025}" x2="${x+.4}" y2="${DIVH}" stroke="#fff" stroke-width=".3" opacity=".1" stroke-linecap="round"/>`;
    s+=`<line x1="${x+.4}" y1="${DIVH+BARH}" x2="${x+.4}" y2="${H*.975}" stroke="#fff" stroke-width=".3" opacity=".1" stroke-linecap="round"/>`;

    // Heaven bead
    const hy=hA?hAcY:hInY;
    const hF=hA?bAF:bIF,hS=hA?bAS:bIS;
    s+=`<g onclick="togH(${ci})" style="cursor:pointer">`;
    s+=`<ellipse cx="${x}" cy="${hy}" rx="${bRx}" ry="${bRy}" fill="${hF}" stroke="${hS}" stroke-width="1"${hA?` filter="drop-shadow(0 0 4px ${bAG})"`:''}/>`; 
    s+=`<ellipse cx="${x-bRx*.24}" cy="${hy-bRy*.36}" rx="${bRx*.21}" ry="${bRy*.18}" fill="#fff" opacity=".22" pointer-events="none"/>`;
    s+=`</g>`;

    // Earth beads
    const inact=[];
    for(let j=0;j<4;j++)if(!col.e[j])inact.push(j);
    for(let bi=0;bi<4;bi++){
      const act=col.e[bi];
      const by=act
        ? ezT+bRy+bi*bGap
        : ezB-bRy-(inact.length-1-inact.indexOf(bi))*bGap;
      const eF=act?bAF:bIF,eS=act?bAS:bIS;
      s+=`<g onclick="togE(${ci},${bi})" style="cursor:pointer">`;
      s+=`<ellipse cx="${x}" cy="${by}" rx="${bRx}" ry="${bRy}" fill="${eF}" stroke="${eS}" stroke-width="1"${act?` filter="drop-shadow(0 0 4px ${bAG})"`:''}/>`; 
      s+=`<ellipse cx="${x-bRx*.24}" cy="${by-bRy*.36}" rx="${bRx*.21}" ry="${bRy*.18}" fill="#fff" opacity=".22" pointer-events="none"/>`;
      s+=`</g>`;
    }
    const dv=cv(col);
    s+=`<text x="${x}" y="${H-1}" text-anchor="middle" font-size="${digFS}" font-weight="700" fill="${dv>0?dAC:'#252b3d'}">${dv}</text>`;
  });

  const svg=document.getElementById(svgId);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.innerHTML=s;
}

function buildLabels(wrapId,lblId){
  const wrap=document.getElementById(wrapId);
  if(!wrap||wrap.offsetWidth===0)return;
  const lb=getLabels();
  const fs=Math.max(5,Math.min(9,wrap.offsetWidth/RODS/3.2));
  let h='';
  lb.forEach((l,i)=>{
    h+=`<div class="plbl" style="font-size:${fs}px;color:${i===RODS-1?'var(--acc)':'var(--txm)'}">${l}</div>`;
  });
  document.getElementById(lblId).innerHTML=h;
}

function buildBoth(){
  const isDesk=window.innerWidth>=680;
  if(isDesk){
    const dw=document.getElementById('dsk-awrap');
    if(dw&&dw.offsetWidth>0&&dw.offsetHeight>0){
      drawSVG('dsk-asvg',dw.offsetWidth,dw.offsetHeight);
      buildLabels('dsk-awrap','dsk-plbls');
    }
  } else {
    const mw=document.getElementById('mob-awrap');
    if(mw&&mw.offsetWidth>0&&mw.offsetHeight>0){
      drawSVG('mob-asvg',mw.offsetWidth,mw.offsetHeight);
      buildLabels('mob-awrap','mob-plbls');
    }
  }
}

function setRods(r){
  r=Math.max(3,Math.min(21,r));RODS=r;abacus=mkInit();
  ['mob-rcnt','dsk-rcnt'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.value=r;
  });
  ['mob-rlbl','dsk-rlbl'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.textContent=r;
  });
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('sel',parseInt(b.dataset.r)===r));
  doClr();
}

// ── THEME ─────────────────────────────────────────────────────────────────
document.getElementById('tgl').addEventListener('click',()=>{
  dark=!dark;document.body.classList.toggle('light',!dark);
  document.getElementById('tglk').textContent=dark?'🌙':'☀️';
  buildBoth();
});

// ── ROD BUTTONS ───────────────────────────────────────────────────────────
document.querySelectorAll('.rbtn[data-r]').forEach(b=>{
  b.addEventListener('click',()=>setRods(parseInt(b.dataset.r)));
});
document.getElementById('mob-rcnt').addEventListener('change',e=>setRods(parseInt(e.target.value)||13));
document.getElementById('dsk-rcnt').addEventListener('change',e=>setRods(parseInt(e.target.value)||13));

// ── RESIZE ────────────────────────────────────────────────────────────────
let rsz;window.addEventListener('resize',()=>{
  clearTimeout(rsz);rsz=setTimeout(buildBoth,60);
});

// ── INIT ──────────────────────────────────────────────────────────────────
refreshDisplay(0);
requestAnimationFrame(()=>requestAnimationFrame(buildBoth));
</script>
