<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Abacus4You - Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden;font-family:'Segoe UI',system-ui,sans-serif}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
button{font-family:inherit;cursor:pointer}
svg{touch-action:manipulation}
.bead{cursor:pointer}
.qbtn{transition:all 0.15s}
.qbtn:hover{filter:brightness(1.15)}
.lesson-row{cursor:pointer;user-select:none}
.line-btn{transition:all 0.15s}
.line-btn:hover{filter:brightness(1.1)}
input:focus{outline:none}
</style>
</head>
<body>
<div id="root"></div>

<script>
// ─── THEMES ─────────────────────────────────────────────────────────────────
const DARK={
  bg:"#0D1117",surface:"#161B22",card:"#1C2128",border:"#30363D",
  primary:"#00C896",text:"#E6EDF3",textMuted:"#7D8590",textSub:"#B0BEC5",
  gold:"#F0A500",orange:"#E8823A",red:"#E63946",blue:"#4B8EF0",
  woodFrame:"#5C3A00",woodInner:"#3D2000",woodBar:"#C8962E",rod:"#6B3A00",
  beadIdle:"#F4D03F",beadIdleS:"#C4A000",beadActive:"#00C896",beadActiveS:"#009970",
  dActive:"#00C896",dIdle:"#7D8590",toggleBg:"#1C2128",toggleBorder:"#30363D",
};
const LIGHT={
  bg:"#EBF5FB",surface:"#FFFFFF",card:"#DAEEFE",border:"#90CAF9",
  primary:"#1565C0",text:"#0A2342",textMuted:"#4A7A9B",textSub:"#1A5276",
  gold:"#E67E22",orange:"#D35400",red:"#C0392B",blue:"#1565C0",
  woodFrame:"#5C3A00",woodInner:"#3D2000",woodBar:"#C8962E",rod:"#6B3A00",
  beadIdle:"#F4D03F",beadIdleS:"#C4A000",beadActive:"#1565C0",beadActiveS:"#0D47A1",
  dActive:"#1565C0",dIdle:"#90CAF9",toggleBg:"#BBDEFB",toggleBorder:"#90CAF9",
};

// ─── STATE ──────────────────────────────────────────────────────────────────
const RODS=13;
const LABELS=["TKB","KB","TAB","AB","TCr","Cr","TL","L","TTh","Th","H","T","O"];
const LINE_OPTS=[{l:"0 Lines",v:0},{l:"10 Lines",v:10},{l:"100 Lines",v:100},{l:"1,000 Lines",v:1000}];
const LESSONS=[
  {i:"🧮",t:"What is an Abacus?",c:"A Soroban (Japanese abacus) has 13 rods. Each rod represents a place value — from ones (rightmost) to ten-kharab (leftmost). The horizontal bar divides into 'earth' (lower, 4 beads = 1 each) and 'heaven' (upper, 1 bead = 5)."},
  {i:"☝️",t:"Reading Bead Values",c:"Count only beads TOUCHING the middle bar. Heaven bead near bar = 5. Each earth bead near bar = 1. Column value = heaven + earth beads. Example: heaven active + 3 earth = 5+3 = 8."},
  {i:"➕",t:"Addition on Abacus",c:"To add 7+5: Set 7 (heaven + 2 earth). Add 5 by moving heaven bead. Need 2 more but zone is full — use complementary method: carry 1 to next rod, subtract 3 on current."},
  {i:"✋",t:"Complementary Method",c:"When you can't add directly, use complements of 5 or 10. Complement of 4 to 5 = 1. Complement of 7 to 10 = 3. This is the core of fast mental math — your fingers learn patterns automatically."},
  {i:"🔢",t:"Place Values (Indian System)",c:"Right→Left: Ones(O), Tens(T), Hundreds(H), Thousands(Th), Ten-Thousands(TTh), Lakhs(L), Ten-Lakhs(TL), Crores(Cr), Ten-Crores(TCr), Arabs(AB), Ten-Arabs(TAB), Kharabs(KB), Ten-Kharabs(TKB)."},
  {i:"⚡",t:"Speed Techniques",c:"1. Never look at beads individually — feel the pattern. 2. Thumb pushes earth beads up; index pushes down / moves heaven. 3. Practice 15 min daily. 4. Goal: visualize the abacus mentally (mental abacus)."},
  {i:"✖️",t:"Multiplication Basics",c:"For 23×4: set 23, multiply right-to-left. 3×4=12 → write 2, carry 1. 2×4=8, add carry=9. Final: 92. Always work from rightmost digit leftward. Practice single-digit multipliers first."},
  {i:"🏆",t:"Abacus Levels",c:"Level 10 (beginner) → Level 1 (expert) → Dan grades (master). At higher levels you solve 15 numbers at once in under 3 seconds — all mentally! Flash anzan shows each number for just 0.3 seconds."},
];

let dark=true;
let lines=0;
let openLesson=null;
let inputVal="";
let abacus=makeInit();

function makeInit(){
  return Array.from({length:RODS},()=>({h:false,e:[false,false,false,false]}));
}
function colVal(c){return(c.h?5:0)+c.e.filter(Boolean).length;}
function totalNum(){
  let t=0;
  for(let i=0;i<RODS;i++) t+=colVal(abacus[i])*Math.pow(10,RODS-1-i);
  return t;
}
function numToAbacus(n){
  const s=makeInit();
  if(!isFinite(n)||n<0)return s;
  n=Math.min(Math.floor(n),9999999999999);
  const str=String(n).padStart(RODS,"0");
  for(let i=0;i<RODS;i++){
    const d=parseInt(str[i]);
    s[i].h=d>=5;
    const ev=d%5;
    for(let j=0;j<ev;j++)s[i].e[j]=true;
  }
  return s;
}
function toggleHeaven(ci){
  abacus[ci].h=!abacus[ci].h;
  inputVal=String(totalNum());
  render();
}
function toggleEarth(ci,bi){
  const e=abacus[ci].e;
  const active=e.filter(Boolean).length;
  const nc=(active===bi+1)?bi:bi+1;
  for(let j=0;j<4;j++)e[j]=j<nc;
  inputVal=String(totalNum());
  render();
}
function doReset(){abacus=makeInit();inputVal="";render();}
function setQuick(n){abacus=numToAbacus(n);inputVal=String(n);render();}
function handleInput(v){
  inputVal=v;
  const n=parseInt(v,10);
  if(!isNaN(n)&&n>=0)abacus=numToAbacus(n);
  else if(v==="")abacus=makeInit();
  render();
}

// ─── SVG ABACUS ─────────────────────────────────────────────────────────────
function buildAbacusSVG(T,W){
  const svgW=W;
  const colW=svgW/RODS;
  const bRx=Math.max(9,colW*0.38);
  const bRy=Math.max(6,colW*0.23);
  const DIV=82;
  const SH=250;
  const ez=SH-DIV-11-18;

  let s=`<svg id="abacus-svg" viewBox="0 0 ${svgW} ${SH}" width="100%" style="display:block;touch-action:manipulation">`;
  // frame
  s+=`<rect x="0" y="0" width="${svgW}" height="${SH}" rx="14" fill="${T.woodFrame}"/>`;
  s+=`<rect x="5" y="5" width="${svgW-10}" height="${SH-10}" rx="10" fill="${T.woodInner}"/>`;
  // grain
  for(let g=0;g<15;g++){
    s+=`<line x1="${-8+g*(svgW/11)}" y1="5" x2="${-8+g*(svgW/11)+20}" y2="${SH-5}" stroke="#fff" stroke-width="0.4" opacity="0.04"/>`;
  }
  // divider bar
  s+=`<rect x="3" y="${DIV}" width="${svgW-6}" height="11" rx="4" fill="${T.woodBar}"/>`;
  s+=`<rect x="3" y="${DIV+2}" width="${svgW-6}" height="2" rx="1" fill="#fff" opacity="0.18"/>`;

  abacus.forEach((col,ci)=>{
    const x=ci*colW+colW/2;
    const hA=col.h;
    const hy=hA?DIV-13:20;
    // rods
    s+=`<line x1="${x}" y1="12" x2="${x}" y2="${DIV}" stroke="${T.rod}" stroke-width="2.5" stroke-linecap="round"/>`;
    s+=`<line x1="${x}" y1="${DIV+11}" x2="${x}" y2="${SH-16}" stroke="${T.rod}" stroke-width="2.5" stroke-linecap="round"/>`;
    // heaven
    const hF=hA?T.beadActive:T.beadIdle, hS=hA?T.beadActiveS:T.beadIdleS;
    s+=`<g class="bead" data-t="h" data-c="${ci}" style="cursor:pointer">`;
    s+=`<ellipse cx="${x}" cy="${hy}" rx="${bRx}" ry="${bRy}" fill="${hF}" stroke="${hS}" stroke-width="1.5"/>`;
    s+=`<ellipse cx="${x-bRx*0.28}" cy="${hy-bRy*0.35}" rx="${bRx*0.28}" ry="${bRy*0.26}" fill="#fff" opacity="0.22" pointer-events="none"/>`;
    s+=`</g>`;
    // earth
    col.e.forEach((act,bi)=>{
      const fy=act ? DIV+13+bRy+bi*(bRy*2+2) : DIV+13+ez*(0.12+bi*0.26);
      const eF=act?T.beadActive:T.beadIdle, eS=act?T.beadActiveS:T.beadIdleS;
      s+=`<g class="bead" data-t="e" data-c="${ci}" data-b="${bi}" style="cursor:pointer">`;
      s+=`<ellipse cx="${x}" cy="${fy}" rx="${bRx}" ry="${bRy}" fill="${eF}" stroke="${eS}" stroke-width="1.5"/>`;
      s+=`<ellipse cx="${x-bRx*0.28}" cy="${fy-bRy*0.35}" rx="${bRx*0.28}" ry="${bRy*0.26}" fill="#fff" opacity="0.22" pointer-events="none"/>`;
      s+=`</g>`;
    });
    // digit
    const cv=colVal(col);
    s+=`<text x="${x}" y="${SH-4}" text-anchor="middle" font-size="${Math.max(7,Math.min(10,colW*0.35))}" font-weight="700" fill="${cv>0?T.dActive:T.dIdle}">${cv}</text>`;
  });

  s+=`</svg>`;
  return s;
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function render(){
  const T=dark?DARK:LIGHT;
  const tn=totalNum();
  const rootEl=document.getElementById('root');
  const W=(rootEl.offsetWidth||380)-24;

  let h=`<div style="background:${T.bg};min-height:100vh;color:${T.text}">`;

  // HEADER
  h+=`<div style="background:${T.surface};border-bottom:1px solid ${T.border};padding:0 14px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50;width:100%">
  <div style="display:flex;align-items:center;gap:9px">
    <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,${T.primary},${T.blue});display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0">🧮</div>
    <div>
      <div style="font-weight:900;font-size:15px;line-height:1.15"><span style="color:${T.primary}">Abacus</span><span style="color:${T.text}">4You</span></div>
      <div style="font-size:9px;color:${T.textMuted};letter-spacing:1px">TRAINING PLATFORM</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <div id="theme-toggle" style="width:50px;height:26px;border-radius:999px;background:${T.toggleBg};border:1.5px solid ${T.toggleBorder};position:relative;cursor:pointer;flex-shrink:0">
      <div style="width:20px;height:20px;border-radius:50%;background:${dark?"#F0A500":"#1565C0"};position:absolute;top:2px;left:${dark?"27px":"2px"};transition:left 0.3s;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1">${dark?"🌙":"☀️"}</div>
    </div>
    <button style="background:${T.primary};color:${dark?"#000":"#fff"};border:none;border-radius:999px;padding:7px 14px;font-weight:700;font-size:12px;white-space:nowrap">Join Free</button>
  </div>
</div>`;

  // PAGE TITLE
  h+=`<div style="padding:16px 14px 8px;display:flex;align-items:center;gap:10px">
  <div style="width:36px;height:36px;border-radius:10px;background:${T.primary}33;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🧮</div>
  <div>
    <div style="font-size:19px;font-weight:900">Abacus Simulator</div>
    <div style="font-size:11px;color:${T.textMuted}">Interactive Soroban · 13 Rods · Tap beads to activate</div>
  </div>
</div>`;

  // CONTROL CARD
  h+=`<div style="padding:0 12px 10px">
  <div style="background:${T.card};border:1px solid ${T.border};border-radius:20px;padding:14px">
    <div style="font-size:40px;font-weight:900;color:${T.primary};font-family:monospace;text-align:center;margin-bottom:12px;letter-spacing:2px;word-break:break-all">${tn.toLocaleString('en-IN')}</div>
    <input id="num-input" type="number" value="${inputVal}" placeholder="Type a number to set abacus…"
      style="width:100%;background:${T.surface};border:1.5px solid ${T.border};color:${T.text};border-radius:12px;padding:11px 13px;font-size:14px;font-family:monospace;outline:none;display:block;margin-bottom:10px;transition:border-color 0.2s">
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px">
      <span style="color:${T.textMuted};font-size:11px;font-weight:600">Quick:</span>`;
  [1,5,9,15,45,99,123,999,1234,9999,99999,1234567].forEach(n=>{
    h+=`<button class="qbtn" data-n="${n}" style="background:${T.surface};border:1px solid ${T.border};color:${T.textSub};border-radius:8px;padding:4px 9px;font-size:11px;font-family:monospace">${n.toLocaleString()}</button>`;
  });
  h+=`</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
      <button id="reset-btn" style="background:${T.red}22;border:1.5px solid ${T.red}66;color:${T.red};border-radius:11px;padding:9px 18px;font-size:12px;font-weight:700;flex-shrink:0">↺ Reset</button>
      <div style="flex:1;background:${T.surface};border-radius:11px;padding:9px 12px;font-size:11px;color:${T.textMuted};display:flex;align-items:center;gap:5px;min-width:0">
        <div style="width:7px;height:7px;border-radius:50%;background:${T.primary};flex-shrink:0"></div>
        <span>Unit:</span><span style="color:${T.primary};font-weight:700;margin-left:3px">ones</span>
        <span style="margin-left:auto;white-space:nowrap">Tap beads to toggle</span>
      </div>
    </div>
    <div>
      <div style="font-size:11px;color:${T.textMuted};margin-bottom:7px;font-weight:600">Practice Lines:</div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">`;
  LINE_OPTS.forEach(o=>{
    const sel=lines===o.v;
    h+=`<button class="line-btn" data-v="${o.v}" style="background:${sel?T.primary:T.surface};color:${sel?(dark?"#000":"#fff"):T.textSub};border:1px solid ${sel?T.primary:T.border};border-radius:9px;padding:5px 12px;font-size:11px;font-weight:700">${o.l}</button>`;
  });
  h+=`</div></div></div></div>`;

  // PLACE LABELS
  h+=`<div style="padding:0 12px 3px"><div style="display:flex;width:100%">`;
  LABELS.forEach((lb,i)=>{
    const fs=Math.max(7,Math.min(10,W/RODS/4));
    h+=`<div style="flex:1;text-align:center;font-size:${fs}px;color:${i===RODS-1?T.primary:T.textMuted};font-weight:700;overflow:hidden">${lb}</div>`;
  });
  h+=`</div></div>`;

  // ABACUS SVG
  h+=`<div style="padding:0 12px 10px">
  <div style="background:${T.card};border:1px solid ${T.border};border-radius:16px;overflow:hidden;width:100%">
    ${buildAbacusSVG(T,W)}
  </div>`;

  // Practice lines
  if(lines>0){
    h+=`<div style="margin-top:10px;background:${T.card};border:1px solid ${T.border};border-radius:14px;padding:10px 14px;overflow:hidden">
    <div style="font-size:11px;color:${T.textMuted};margin-bottom:8px;font-weight:600">Practice Lines (${lines.toLocaleString()})</div>`;
    const MAX_RENDER=Math.min(lines,1000);
    for(let i=0;i<MAX_RENDER;i++){
      h+=`<div style="border-bottom:1px solid ${T.border};height:24px;display:flex;align-items:center;padding-left:6px"><span style="font-size:9px;color:${T.border};min-width:28px">${i+1}</span></div>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;

  // ABACUS STRUCTURE
  const structs=[
    {dot:T.orange,t:"Frame",s:"Wooden outer structure"},
    {dot:T.orange,t:"Middle Bar",s:"Divides heaven & earth"},
    {dot:T.textMuted,t:"13 Rods",s:"Place values ones→trillions"},
    {dot:T.gold,t:"Upper Bead",s:"1 per rod = 5"},
    {dot:T.beadActive,t:"Lower Beads",s:"4 per rod = 1 each"},
    {dot:T.primary,t:"Unit Pointer",s:"Marks ones column"},
  ];
  h+=`<div style="padding:0 12px 10px">
  <div style="font-size:15px;font-weight:900;margin-bottom:10px;color:${T.text}">Abacus Structure</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">`;
  structs.forEach(st=>{
    h+=`<div style="background:${T.card};border:1px solid ${T.border};border-radius:13px;padding:11px 12px">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">
        <div style="width:9px;height:9px;border-radius:50%;background:${st.dot};flex-shrink:0"></div>
        <span style="font-weight:700;font-size:12px;color:${T.text}">${st.t}</span>
      </div>
      <span style="font-size:11px;color:${T.textMuted};padding-left:16px;display:block">${st.s}</span>
    </div>`;
  });
  h+=`</div></div>`;

  // LEARNING GUIDE
  h+=`<div style="padding:0 12px 40px">
  <div style="font-size:15px;font-weight:900;margin-bottom:10px;color:${T.text}">📖 Learning Guide</div>`;
  LESSONS.forEach((ls,i)=>{
    const isOpen=openLesson===i;
    h+=`<div style="background:${T.card};border:1px solid ${isOpen?T.primary+"66":T.border};border-radius:13px;overflow:hidden;margin-bottom:7px">
      <div class="lesson-row" data-idx="${i}" style="padding:12px 13px;display:flex;align-items:center;gap:9px">
        <span style="font-size:17px;flex-shrink:0">${ls.i}</span>
        <span style="flex:1;font-weight:700;font-size:12px;color:${T.text}">${ls.t}</span>
        <span style="color:${T.textMuted};font-size:16px;transition:transform 0.2s;display:inline-block;transform:${isOpen?"rotate(90deg)":"rotate(0deg)"};flex-shrink:0">›</span>
      </div>`;
    if(isOpen){
      h+=`<div style="padding:0 13px 13px;border-top:1px solid ${T.border};padding-top:9px;font-size:12px;color:${T.textSub};line-height:1.7">${ls.c}</div>`;
    }
    h+=`</div>`;
  });
  h+=`</div></div>`;

  rootEl.innerHTML=h;
  attachEvents();
}

function attachEvents(){
  document.getElementById('theme-toggle')?.addEventListener('click',()=>{dark=!dark;render();});
  document.getElementById('reset-btn')?.addEventListener('click',doReset);
  const inp=document.getElementById('num-input');
  if(inp){
    inp.addEventListener('input',e=>handleInput(e.target.value));
    inp.addEventListener('focus',e=>{e.target.style.borderColor=dark?DARK.primary:LIGHT.primary;});
    inp.addEventListener('blur',e=>{e.target.style.borderColor=dark?DARK.border:LIGHT.border;});
  }
  document.querySelectorAll('.qbtn').forEach(b=>{
    b.addEventListener('click',()=>setQuick(parseInt(b.dataset.n)));
  });
  document.querySelectorAll('.line-btn').forEach(b=>{
    b.addEventListener('click',()=>{lines=parseInt(b.dataset.v);render();});
  });
  document.querySelectorAll('#abacus-svg .bead').forEach(el=>{
    el.addEventListener('click',()=>{
      const ci=parseInt(el.dataset.c);
      if(el.dataset.t==='h') toggleHeaven(ci);
      else toggleEarth(ci,parseInt(el.dataset.b));
    });
  });
  document.querySelectorAll('.lesson-row').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx=parseInt(el.dataset.idx);
      openLesson=openLesson===idx?null:idx;
      render();
    });
  });
}

// Initial render + re-render on resize
render();
let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(render,80);
});
</script>
</body>
</html>
