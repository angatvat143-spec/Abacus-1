<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Abacus4You</title>
<style>
/* ── VARS ── */
:root{
  --bg:#07080d;--c1:#0c0e15;--c2:#10131c;--c3:#151822;
  --b1:#1a1e2e;--b2:#222638;--b3:#2a2f45;
  --acc:#00e5a0;--acc2:#00b87a;--acc3:#00ff9f;--accg:rgba(0,229,160,.2);
  --blue:#4b8ef0;--blueg:rgba(75,142,240,.2);
  --red:#e63946;--gold:#f0a500;--gold2:#c07800;
  --tx:#eef0f8;--txm:#6b738f;--txs:#9ba3c0;
  --pad-bg:rgba(16,19,28,.9);
  --pad-border:rgba(42,47,69,.8);
}
body.light{
  --bg:#deeefb;--c1:#fff;--c2:#eaf4fd;--c3:#d5e9f9;
  --b1:#b8d8f4;--b2:#90caf9;--b3:#64b5f6;
  --acc:#1565c0;--acc2:#0d47a1;--acc3:#1976d2;--accg:rgba(21,101,192,.15);
  --blue:#1565c0;--blueg:rgba(21,101,192,.15);
  --red:#c62828;--gold:#e65100;--gold2:#bf360c;
  --tx:#0a1f3d;--txm:#3a6186;--txs:#1a4a7a;
  --pad-bg:rgba(255,255,255,.9);
  --pad-border:rgba(100,181,246,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit;outline:none}
svg{display:block}

/* ══ HEADER ══ */
#hdr{
  height:52px;flex-shrink:0;z-index:10;
  background:rgba(7,8,13,.96);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--b1);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
}
body.light #hdr{background:rgba(255,255,255,.97)}
.logo{display:flex;align-items:center;gap:10px}
.lic{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc),var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 4px 14px rgba(0,229,160,.3);
}
.lnm{font-weight:900;font-size:15px;line-height:1.1}
.lnm .a{color:var(--acc)}.lnm .b{color:var(--tx)}
.lsb{font-size:8px;color:var(--txm);letter-spacing:1.5px;text-transform:uppercase}
.hr{display:flex;align-items:center;gap:10px}
.tgl{width:48px;height:26px;border-radius:99px;background:var(--c3);
  border:1.5px solid var(--b2);position:relative;cursor:pointer;transition:background .3s}
.tglk{width:20px;height:20px;border-radius:50%;position:absolute;top:2px;left:25px;
  transition:left .26s,background .26s;
  display:flex;align-items:center;justify-content:center;font-size:12px;background:#f0a500}
body.light .tglk{left:2px;background:#1565c0}
body.light .tgl{background:#c2e0f5;border-color:#64b5f6}
.jbtn{
  background:linear-gradient(135deg,var(--acc),#00c880);
  color:#000;border-radius:99px;padding:7px 18px;
  font-weight:800;font-size:12px;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,229,160,.35);
  transition:transform .12s,filter .12s;
}
body.light .jbtn{color:#fff}
.jbtn:hover{filter:brightness(1.1)}.jbtn:active{transform:scale(.93)}

/* ══ LAYOUT ══ */
#body{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex;overflow:hidden}

/* MOBILE */
#lcol{width:100%;height:100%;display:flex;flex-direction:column;
  padding:8px 9px 7px;gap:7px;overflow:hidden}
#rcol{display:none}

/* DESKTOP ≥680 */
@media(min-width:680px){
  #lcol{width:340px;flex-shrink:0;border-right:1px solid var(--b1);
    padding:12px 12px 10px;gap:8px;overflow:hidden}
  #rcol{flex:1;min-width:0;display:flex!important;flex-direction:column;
    padding:12px 16px 10px;gap:7px;overflow:hidden}
  #mob-nr,#mob-or{display:none!important}
  #mab{display:none!important}
  #dsk-pad{display:flex!important}
  #ad-slot{display:block!important}
}
@media(min-width:900px){
  #lcol{width:370px;padding:14px 14px 12px}
  #rcol{padding:14px 20px 12px}
}
@media(min-width:1200px){#lcol{width:400px}}

/* ══ VALUE CARD ══ */
#cv{
  flex-shrink:0;position:relative;overflow:hidden;
  cursor:text;user-select:none;
  border-radius:18px;padding:13px 15px 11px;
  background:linear-gradient(145deg,rgba(0,229,160,.1) 0%,rgba(75,142,240,.06) 60%,rgba(7,8,13,.95) 100%);
  border:1.5px solid rgba(0,229,160,.22);
  transition:border-color .2s,box-shadow .2s;
  box-shadow:0 4px 24px rgba(0,0,0,.3);
}
#cv::before{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:18px;
  background:radial-gradient(ellipse at 10% 10%,rgba(0,229,160,.12),transparent 50%),
             radial-gradient(ellipse at 90% 90%,rgba(75,142,240,.08),transparent 50%);
}
#cv::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;border-radius:18px 18px 0 0;
  background:linear-gradient(90deg,transparent,rgba(0,229,160,.4),transparent);
  pointer-events:none;
}
#cv.act{border-color:rgba(0,229,160,.55);box-shadow:0 0 0 3px rgba(0,229,160,.1),0 4px 24px rgba(0,0,0,.3)}
body.light #cv{
  background:linear-gradient(145deg,rgba(21,101,192,.1),rgba(100,181,246,.05),rgba(255,255,255,.9));
  border-color:rgba(21,101,192,.28);box-shadow:0 4px 20px rgba(21,101,192,.1);
}
body.light #cv::before{
  background:radial-gradient(ellipse at 10% 10%,rgba(21,101,192,.1),transparent 50%);
}
body.light #cv::after{
  background:linear-gradient(90deg,transparent,rgba(21,101,192,.35),transparent);
}
body.light #cv.act{border-color:rgba(21,101,192,.55);box-shadow:0 0 0 3px rgba(21,101,192,.1)}
#hi{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;
  border:none;background:transparent;font-size:16px;pointer-events:none;z-index:-1;
  color:transparent;caret-color:transparent}
.cvlbl{
  font-size:9px;font-weight:700;color:var(--acc2);letter-spacing:2px;
  text-transform:uppercase;margin-bottom:6px;opacity:.75;
  display:flex;align-items:center;gap:6px;
}
.cvlbl::before{
  content:'';width:16px;height:1.5px;
  background:linear-gradient(90deg,var(--acc2),transparent);
  flex-shrink:0;
}

/* ── MAIN DISPLAY: single line shows expression OR answer ── */
#maindisp{
  /* While typing: shows expression e.g. 8+28-10+8-2-4  */
  /* After =: shows answer in big glowing number          */
  font-family:'Courier New',monospace;
  word-break:break-all;line-height:1.15;
  text-align:right;
  padding:10px 4px 8px;
  min-height:72px;display:flex;align-items:center;justify-content:flex-end;
  position:relative;
}
/* Expression mode: BIG, prominent, right-aligned */
#maindisp.mode-expr{
  font-size:clamp(22px,5.5vw,36px);
  font-weight:700;
  color:var(--acc);opacity:1;letter-spacing:.5px;
  text-shadow:0 0 22px rgba(0,229,160,.35),0 0 6px rgba(0,229,160,.2);
  justify-content:flex-end;text-align:right;
}
body.light #maindisp.mode-expr{
  text-shadow:0 0 18px rgba(21,101,192,.3);
}
/* Answer mode: big bold glowing */
#maindisp.mode-ans{
  font-size:clamp(40px,7vw,60px);font-weight:900;
  color:var(--acc);letter-spacing:3px;justify-content:center;text-align:center;
  text-shadow:0 0 32px var(--accg),0 2px 0 rgba(0,0,0,.3);
}
/* Cursor blink */
#maindisp.foc::after{
  content:'|';display:inline-block;color:var(--acc);
  animation:bl .85s step-end infinite;margin-left:2px;font-size:.65em;opacity:.7;
}
@keyframes bl{0%,100%{opacity:.7}50%{opacity:0}}
/* Zero/empty placeholder */
#maindisp.mode-zero{
  font-size:clamp(40px,7vw,60px);font-weight:900;
  color:var(--acc);letter-spacing:3px;justify-content:center;text-align:center;
  text-shadow:0 0 24px rgba(0,229,160,.15);opacity:.45;
}
/* Pop animation on answer */
#maindisp.pop{animation:popN .24s cubic-bezier(.4,0,.2,1)}
@keyframes popN{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.pi{
  font-size:9px;color:var(--txm);text-align:center;
  border-top:1px solid rgba(255,255,255,.06);padding-top:5px;margin-top:7px;line-height:1.5;
}
body.light .pi{border-top-color:rgba(0,0,0,.08)}
.pi b{color:var(--acc);font-weight:700}

/* ══ MOBILE KEYBOARD ══ */
#mob-nr{
  flex-shrink:0;display:grid;grid-template-columns:repeat(10,1fr);gap:5px;
  background:var(--pad-bg);border:1px solid var(--pad-border);
  border-radius:14px;padding:7px;backdrop-filter:blur(8px);
}
#mob-or{
  flex-shrink:0;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;
  background:var(--pad-bg);border:1px solid var(--pad-border);
  border-radius:14px;padding:7px;backdrop-filter:blur(8px);
}

/* ══ DESKTOP NUMPAD ══ */
#dsk-pad{
  display:none;flex-shrink:0;gap:6px;flex-direction:row;
  background:var(--pad-bg);border:1px solid var(--pad-border);
  border-radius:16px;padding:10px;backdrop-filter:blur(8px);
}
.np-nums{
  flex:1;display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:6px;
}
.np-ops{
  width:58px;flex-shrink:0;
  display:grid;grid-template-rows:repeat(6,1fr);gap:6px;
}

/* ══ SHARED KEYS ══ */
.kb{
  height:46px;border-radius:10px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;position:relative;overflow:hidden;
  transition:transform .1s,filter .12s,box-shadow .12s;
  letter-spacing:.3px;
}
.kb:hover{filter:brightness(1.15)}
.kb:active{transform:scale(.86)!important;filter:brightness(1.2)!important}
.kb::after{
  content:'';position:absolute;inset:0;border-radius:10px;
  background:rgba(255,255,255,.12);opacity:0;transition:opacity .1s;
}
.kb:active::after{opacity:1}

/* Number keys — premium glass */
.kn{
  background:linear-gradient(145deg,var(--c3),var(--c2));
  color:var(--tx);border-color:var(--b2);
  box-shadow:0 2px 6px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.06);
}
body.light .kn{
  background:linear-gradient(145deg,#f5f9ff,#e8f2fd);
  border-color:var(--b2);
  box-shadow:0 2px 6px rgba(21,101,192,.1),inset 0 1px 0 rgba(255,255,255,.8);
}
.kn:hover{background:linear-gradient(145deg,var(--b2),var(--c3))}
body.light .kn:hover{background:linear-gradient(145deg,#ddeffe,#e8f2fd)}

/* Operator keys — accent glow */
.ko{
  background:linear-gradient(145deg,rgba(0,229,160,.16),rgba(0,229,160,.08));
  color:var(--acc);border-color:rgba(0,229,160,.25);font-size:17px;
  box-shadow:0 2px 8px rgba(0,229,160,.15),inset 0 1px 0 rgba(0,229,160,.1);
}
body.light .ko{
  background:linear-gradient(145deg,rgba(21,101,192,.13),rgba(21,101,192,.06));
  color:var(--acc);border-color:rgba(21,101,192,.28);
  box-shadow:0 2px 8px rgba(21,101,192,.12);
}
.ko:hover{box-shadow:0 4px 14px rgba(0,229,160,.3)}
body.light .ko:hover{box-shadow:0 4px 14px rgba(21,101,192,.25)}

/* Equals key — bright accent */
.keq{
  background:linear-gradient(145deg,var(--acc),var(--acc2));
  color:#000;border-color:var(--acc2);font-size:18px;font-weight:900;
  box-shadow:0 4px 16px rgba(0,229,160,.4),inset 0 1px 0 rgba(255,255,255,.25);
}
body.light .keq{
  color:#fff;
  box-shadow:0 4px 16px rgba(21,101,192,.4),inset 0 1px 0 rgba(255,255,255,.3);
}
.keq:hover{box-shadow:0 6px 22px rgba(0,229,160,.55)}
body.light .keq:hover{box-shadow:0 6px 22px rgba(21,101,192,.5)}

/* AC key */
.kac{
  background:linear-gradient(145deg,rgba(230,57,70,.18),rgba(230,57,70,.1));
  color:var(--red);border-color:rgba(230,57,70,.28);font-size:12px;font-weight:800;
  box-shadow:0 2px 8px rgba(230,57,70,.15);
}
.kac:hover{box-shadow:0 4px 14px rgba(230,57,70,.3)}

/* Backspace */
.kbs{
  background:linear-gradient(145deg,var(--c3),var(--c2));
  color:var(--txs);border-color:var(--b2);font-size:17px;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
body.light .kbs{background:linear-gradient(145deg,#f5f9ff,#e8f2fd);border-color:var(--b2)}

/* 0 spans 2 cols */
.k0{grid-column:span 2}
/* eq full height in ops col */
.keq-tall{height:100%}

/* ══ GOOGLE ADS SLOT ══ */
#ad-slot{
  display:none; /* shown on desktop */
  flex-shrink:0;
  border-radius:14px;
  border:1.5px dashed rgba(0,229,160,.2);
  background:rgba(0,229,160,.03);
  min-height:90px;
  position:relative;
  overflow:hidden;
}
body.light #ad-slot{
  border-color:rgba(21,101,192,.2);background:rgba(21,101,192,.03);
}
#ad-slot::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,229,160,.04),transparent 60%);
  pointer-events:none;
}
.ad-inner{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;
  font-size:9px;color:var(--txm);letter-spacing:1px;text-transform:uppercase;
  /* Replace this div content with your Google AdSense code */
}
.ad-tag{
  font-size:8px;color:var(--txm);opacity:.4;letter-spacing:1.5px;text-transform:uppercase;
  position:absolute;top:5px;left:8px;
}

/* ══ ABACUS SECTION ══ */
.abwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.abh{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px}
.abt{
  font-size:12px;font-weight:700;color:var(--txs);
  display:flex;align-items:center;gap:7px;
}
.abt-dot{
  width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),var(--blue));
  box-shadow:0 0 6px var(--accg);flex-shrink:0;
}
.abi{font-size:10px;color:var(--txm)}.abi b{color:var(--gold);font-weight:700}
.plbls{display:flex;width:100%;margin-bottom:2px;flex-shrink:0}
.plbl{flex:1;text-align:center;font-weight:700;overflow:hidden}
#daw,#maw{
  flex:1;min-height:0;border-radius:13px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04);
}
#das,#mas{width:100%;height:100%}

/* Rod controls */
.rctl{flex-shrink:0;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.rlbl{font-size:9px;font-weight:700;color:var(--txm);letter-spacing:.8px;text-transform:uppercase}
.rb{
  background:var(--c3);border:1px solid var(--b2);color:var(--txs);
  border-radius:6px;padding:3px 10px;font-size:10px;font-weight:700;transition:all .12s;
}
.rb:hover{border-color:var(--gold);color:var(--gold)}
.rb.sel{
  background:linear-gradient(135deg,var(--gold2),#a06000);
  border-color:var(--gold);color:#fff;
  box-shadow:0 2px 8px rgba(240,165,0,.3);
}
.rb:active{transform:scale(.9)}
.stpr{display:flex;align-items:center;border:1px solid var(--b2);border-radius:6px;overflow:hidden}
.sbs{background:var(--c3);color:var(--txs);width:24px;height:24px;font-size:13px;font-weight:700;border:none}
.sbs:hover{background:var(--acc2);color:#fff}
.sns{background:var(--c2);color:var(--tx);width:30px;height:24px;text-align:center;
  border:none;border-left:1px solid var(--b2);border-right:1px solid var(--b2);
  font-size:10px;font-weight:700;font-family:monospace}

/* Desktop info chips */
#dchips{display:none;flex-shrink:0;flex-wrap:wrap;gap:6px}
@media(min-width:680px){#dchips{display:flex}}
.chip{
  display:flex;align-items:center;gap:6px;
  background:var(--c2);border:1px solid var(--b2);
  border-radius:8px;padding:5px 11px;font-size:10px;color:var(--txm);
}
.chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip strong{color:var(--tx);font-size:11px}

/* Mobile abacus */
#mab{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;overflow:hidden}

/* Toast */
#toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#000;border-radius:99px;padding:8px 20px;font-size:11px;font-weight:700;
  opacity:0;transition:all .25s;pointer-events:none;z-index:999;
  box-shadow:0 4px 18px rgba(0,229,160,.4);
}
body.light #toast{color:#fff}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
  <div class="logo">
    <div class="lic">🧮</div>
    <div>
      <div class="lnm"><span class="a">Abacus</span><span class="b">4You</span></div>
      <div class="lsb">Training Platform</div>
    </div>
  </div>
  <div class="hr">
    <div class="tgl" id="tgl"><div class="tglk" id="tglk">🌙</div></div>
    <button class="jbtn">Join Free</button>
  </div>
</div>

<div id="body">

  <!-- LEFT COLUMN -->
  <div id="lcol">

    <!-- Value Card -->
    <div id="cv" onclick="openKb()">
      <input id="hi" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="cvlbl">Current Value</div>
      <div id="maindisp" class="mode-zero">0</div>
      <div class="pi" id="pi"><b>0</b> — Zero</div>
    </div>

    <!-- MOBILE: number row (1-9, 0) -->
    <div id="mob-nr">
      <button class="kb kn" onclick="kn('1')">1</button>
      <button class="kb kn" onclick="kn('2')">2</button>
      <button class="kb kn" onclick="kn('3')">3</button>
      <button class="kb kn" onclick="kn('4')">4</button>
      <button class="kb kn" onclick="kn('5')">5</button>
      <button class="kb kn" onclick="kn('6')">6</button>
      <button class="kb kn" onclick="kn('7')">7</button>
      <button class="kb kn" onclick="kn('8')">8</button>
      <button class="kb kn" onclick="kn('9')">9</button>
      <button class="kb kn" onclick="kn('0')">0</button>
    </div>
    <!-- MOBILE: operator row -->
    <div id="mob-or">
      <button class="kb kac" onclick="clr()">AC</button>
      <button class="kb kbs" onclick="bs()">⌫</button>
      <button class="kb ko"  onclick="op('+')">+</button>
      <button class="kb ko"  onclick="op('-')">−</button>
      <button class="kb ko"  onclick="op('*')">×</button>
      <button class="kb ko"  onclick="op('/')">÷</button>
      <button class="kb keq" onclick="eq()">=</button>
    </div>

    <!-- DESKTOP: numpad grid + ops column -->
    <div id="dsk-pad">
      <div class="np-nums">
        <button class="kb kn" onclick="kn('7')">7</button>
        <button class="kb kn" onclick="kn('8')">8</button>
        <button class="kb kn" onclick="kn('9')">9</button>
        <button class="kb kn" onclick="kn('4')">4</button>
        <button class="kb kn" onclick="kn('5')">5</button>
        <button class="kb kn" onclick="kn('6')">6</button>
        <button class="kb kn" onclick="kn('1')">1</button>
        <button class="kb kn" onclick="kn('2')">2</button>
        <button class="kb kn" onclick="kn('3')">3</button>
        <button class="kb kn k0" onclick="kn('0')">0</button>
        <button class="kb kbs" onclick="bs()">⌫</button>
      </div>
      <div class="np-ops">
        <button class="kb kac" onclick="clr()">AC</button>
        <button class="kb ko"  onclick="op('+')">+</button>
        <button class="kb ko"  onclick="op('-')">−</button>
        <button class="kb ko"  onclick="op('*')">×</button>
        <button class="kb ko"  onclick="op('/')">÷</button>
        <button class="kb keq keq-tall" onclick="eq()">=</button>
      </div>
    </div>

    <!-- GOOGLE ADS SLOT (desktop only, below numpad) -->
    <div id="ad-slot">
      <span class="ad-tag">Advertisement</span>
      <div class="ad-inner">
        <!-- ════════════════════════════════════════════
             PASTE YOUR GOOGLE ADSENSE CODE HERE
             Recommended: 336×90 or responsive leaderboard
             ════════════════════════════════════════════ -->
        <div style="opacity:.25;font-size:20px">📢</div>
        <div style="font-size:9px;color:var(--txm);letter-spacing:1px">AD SPACE · 16:9</div>
      </div>
    </div>

    <!-- MOBILE: abacus -->
    <div id="mab">
      <div class="abh">
        <div class="abt"><div class="abt-dot"></div>Soroban Abacus</div>
        <div class="abi">Rods: <b id="mrl">13</b> · Tap beads</div>
      </div>
      <div class="plbls" id="mpl"></div>
      <div id="maw"><svg id="mas" preserveAspectRatio="none"></svg></div>
      <div class="rctl">
        <span class="rlbl">Rods:</span>
        <button class="rb" data-r="5">5</button>
        <button class="rb" data-r="7">7</button>
        <button class="rb" data-r="9">9</button>
        <button class="rb sel" data-r="13">13</button>
        <button class="rb" data-r="17">17</button>
        <div class="stpr">
          <button class="sbs" onclick="setR(RODS-1)">−</button>
          <input class="sns" id="mrc" type="number" min="3" max="21" value="13">
          <button class="sbs" onclick="setR(RODS+1)">+</button>
        </div>
      </div>
    </div>

  </div><!-- /lcol -->

  <!-- DESKTOP RIGHT COLUMN -->
  <div id="rcol">
    <div id="dchips">
      <div class="chip"><div class="dot" style="background:#f4d03f"></div>Upper Bead = <strong>5</strong></div>
      <div class="chip"><div class="dot" style="background:var(--acc)"></div>Lower Bead = <strong>1</strong></div>
      <div class="chip"><div class="dot" style="background:var(--gold)"></div>Active beads touch the bar</div>
      <div class="chip"><div class="dot" style="background:var(--acc)"></div><span id="vchip-t">0 — Zero</span></div>
    </div>
    <div class="abwrap">
      <div class="abh">
        <div class="abt"><div class="abt-dot"></div>Soroban Abacus</div>
        <div class="abi">Rods: <b id="drl">13</b> · Click beads to toggle</div>
      </div>
      <div class="plbls" id="dpl"></div>
      <div id="daw"><svg id="das" preserveAspectRatio="none"></svg></div>
      <div class="rctl">
        <span class="rlbl">Rods:</span>
        <button class="rb" data-r="5">5</button>
        <button class="rb" data-r="7">7</button>
        <button class="rb" data-r="9">9</button>
        <button class="rb sel" data-r="13">13</button>
        <button class="rb" data-r="17">17</button>
        <div class="stpr">
          <button class="sbs" onclick="setR(RODS-1)">−</button>
          <input class="sns" id="drc" type="number" min="3" max="21" value="13">
          <button class="sbs" onclick="setR(RODS+1)">+</button>
        </div>
      </div>
    </div>
  </div>

</div><!-- /body -->
<div id="toast">✓ Copied!</div>

<script>
// ── AUDIO ────────────────────────────────────────────────────────────────────
let _AC=null;
function ga(){if(!_AC)_AC=new(window.AudioContext||window.webkitAudioContext)();return _AC}
function tone(f,d,v=0.07){
  try{const C=ga(),o=C.createOscillator(),g=C.createGain();
    o.connect(g);g.connect(C.destination);o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(v,C.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,C.currentTime+d);
    o.start(C.currentTime);o.stop(C.currentTime+d);
  }catch(e){}}
function sNum(){tone(760,0.05,0.055)}
function sOp(){tone(540,0.07,0.055)}
function sEq(){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.1,0.055),i*75))}
function sBead(on){tone(on?860:640,0.07,0.06)}
function sClr(){tone(400,0.09,0.055)}
function sBs(){tone(480,0.05,0.05)}

// ── STATE ────────────────────────────────────────────────────────────────────
let RODS=13,dark=true,lastN=0;
let ab=init();
let ex='',cu='',ev=false;

const LBLS=["TKB","KB","TAB","AB","TCr","Cr","TL","L","TTh","Th","H","T","O",
            "Ten-Q","Q","Ten-P","P","Ten-O2","O2","O3","O4"];
const PN={O:"Ones",T:"Tens",H:"Hundreds",Th:"Thousands",TTh:"Ten Thousands",
  L:"Lakhs",TL:"Ten Lakhs",Cr:"Crores",TCr:"Ten Crores",
  AB:"Arabs",TAB:"Ten Arabs",KB:"Kharabs",TKB:"Ten Kharabs"};

// ── ABACUS CORE ───────────────────────────────────────────────────────────────
function init(){return Array.from({length:RODS},()=>({h:false,e:[false,false,false,false]}))}
function cv(c){return(c.h?5:0)+c.e.filter(Boolean).length}
function tot(){let t=0;for(let i=0;i<RODS;i++)t+=cv(ab[i])*Math.pow(10,RODS-1-i);return t}
function n2a(n){
  const s=init();if(!isFinite(n)||n<0)return s;
  n=Math.min(Math.floor(Math.abs(n)),Math.pow(10,RODS)-1);
  const str=String(n).padStart(RODS,"0");
  for(let i=0;i<RODS;i++){
    const d=parseInt(str[i]);s[i].h=d>=5;
    const e2=d%5;for(let j=0;j<e2;j++)s[i].e[j]=true;
  }
  return s;
}
function getL(){
  const a=LBLS;
  if(RODS<=a.length)return a.slice(a.length-RODS);
  return Array.from({length:RODS-a.length},(_,i)=>`R${i+1}`).concat(a);
}
function ptxt(n){
  if(n===0)return`<b>0</b> — Zero`;
  const lb=getL(),ds=String(Math.floor(Math.abs(n))).padStart(RODS,"0");
  const pts=[];
  lb.forEach((l,i)=>{if(parseInt(ds[i])>0&&PN[l])pts.push(`<b>${parseInt(ds[i])}</b> ${PN[l]}`)});
  return pts.length?pts.slice(-4).join(' + '):`<b>${n.toLocaleString('en-IN')}</b>`;
}

// ── DISPLAY ───────────────────────────────────────────────────────────────────
// Evaluate full expression including current entry — returns running result
function calcRunning(){
  const full=(ex+cu).replace(/[+\-*\/]$/,'');
  if(!full)return 0;
  try{
    const r=Function('"use strict";return('+full.replace(/[^0-9+\-*\/\.]/g,'')+')')();
    return isFinite(r)?Math.round(Math.abs(r)):0;
  }catch(e){return 0}
}

function setNum(n,skipAb=false){
  n=Math.round(Math.abs(n));
  if(!skipAb)ab=n2a(n);
  rdsp(n);buildBoth();
}
function rdsp(n){
  const md=document.getElementById('maindisp');
  const pi=document.getElementById('pi');
  const vc=document.getElementById('vchip-t');
  const num=Number.isFinite(n)?Math.round(n):0;
  const fmt=num.toLocaleString('en-IN');
  if(vc)vc.textContent=fmt+(num===0?' — Zero':'');
  if(!md)return;
  if(ev){
    // After = pressed: show big glowing answer, show place info below
    md.className='mode-ans pop';
    setTimeout(()=>{ if(md)md.classList.remove('pop') },250);
    md.textContent=fmt;
    if(pi){pi.innerHTML=ptxt(num);pi.style.display='block'}
  } else if(ex||cu){
    // While typing expression: show ONLY expression, hide place info
    md.className='mode-expr';
    md.textContent=(ex+cu).replace(/\*/g,'×').replace(/\//g,'÷');
    if(pi)pi.style.display='none';
  } else {
    // Empty/zero state
    md.className='mode-zero';
    md.textContent='0';
    if(pi){pi.innerHTML='<b>0</b> — Zero';pi.style.display='block'}
  }
  lastN=num;
}
function liveUpdate(){
  const n=calcRunning();
  ab=n2a(n);buildBoth();rdsp(n);
}

// ── NATIVE KEYBOARD ───────────────────────────────────────────────────────────
const hi=document.getElementById('hi');
function openKb(){
  hi.style.cssText='position:fixed;top:40%;left:50%;width:2px;height:2px;opacity:0.01;font-size:16px;border:none;background:transparent;z-index:999;pointer-events:auto;color:transparent;caret-color:transparent;outline:none';
  hi.removeAttribute('readonly');hi.focus();
  const md=document.getElementById('maindisp');if(md)md.classList.add('foc');
  document.getElementById('cv').classList.add('act');
  setTimeout(()=>{hi.style.cssText='position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;font-size:16px;border:none;background:transparent;pointer-events:none;z-index:-1;color:transparent;caret-color:transparent'},500);
}
hi.addEventListener('focus',()=>{const md=document.getElementById('maindisp');if(md)md.classList.add('foc');document.getElementById('cv').classList.add('act')});
hi.addEventListener('blur',()=>{const md=document.getElementById('maindisp');if(md)md.classList.remove('foc');document.getElementById('cv').classList.remove('act')});
hi.addEventListener('input',()=>{const v=hi.value;hi.value='';if(v){const ch=v[v.length-1];if('0123456789'.includes(ch)){sNum();kn(ch)}else if(ch==='.')kn('.')}});

// ── CALCULATOR ────────────────────────────────────────────────────────────────
function kn(ch){
  if(ev){ex='';cu='';ev=false}
  if(ch==='.'&&cu.includes('.'))return;
  if(ch!=='.'&&cu==='0')cu='';
  cu+=ch;liveUpdate();
}
function op(o){
  ev=false;sOp();
  if(cu!==''){ex+=cu+o;cu='';}
  else if(ex.length>0){ex=ex.replace(/[+\-*\/]$/,'')+o;}
  else{ex='0'+o;}
  liveUpdate();
}
function eq(){
  if(!ex&&!cu)return;sEq();
  const full=ex+(cu||'0');
  let res;
  try{res=Function('"use strict";return('+full.replace(/[^0-9+\-*\/\.]/g,'')+')')();}
  catch(e){res=0}
  if(!isFinite(res))res=0;
  ex='';cu=String(Math.round(res));ev=true; // set ev BEFORE rdsp so it shows big answer
  setNum(res);rdsp(res);
}
function bs(){
  if(ev){clr();return}sBs();
  if(cu.length>0){cu=cu.slice(0,-1);liveUpdate();}
  else if(ex.length>0){ex=ex.slice(0,-1);liveUpdate();}
}
function clr(){sClr();ex='';cu='';ev=false;lastN=-1;ab=init();rdsp(0);buildBoth()}

// ── BEAD TOGGLE ───────────────────────────────────────────────────────────────
function togH(ci){
  ab[ci].h=!ab[ci].h;sBead(ab[ci].h);
  const n=tot();ex='';cu=String(n);ev=false;rdsp(n);buildBoth();
}
function togE(ci,bi){
  const e=ab[ci].e,ac=e.filter(Boolean).length,nc=(ac===bi+1)?bi:bi+1;
  for(let j=0;j<4;j++)e[j]=j<nc;
  sBead(ab[ci].e[bi]||false);
  const n=tot();ex='';cu=String(n);ev=false;rdsp(n);buildBoth();
}

// ── PHYSICAL KEYBOARD ─────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.target===hi)return;
  if('0123456789'.includes(e.key)){sNum();kn(e.key)}
  else if(e.key==='+'){op('+')}else if(e.key==='-'){op('-')}
  else if(e.key==='*'){op('*')}
  else if(e.key==='/'){e.preventDefault();op('/')}
  else if(e.key==='Enter'||e.key==='='){eq()}
  else if(e.key==='Backspace'){bs()}
  else if(e.key==='Escape'){clr()}
});

// ── SVG ABACUS ────────────────────────────────────────────────────────────────
function drawSVG(svgId,W,H){
  if(W<10||H<10)return;
  const cW=W/RODS;
  const bRx=Math.max(5,Math.min(cW*.42,19));
  const bRy=Math.max(3.5,Math.min(cW*.255,11,H*.044));
  const bGap=bRy*2+0.7;
  const DY=Math.round(H*.32),BH=Math.max(6,Math.round(H*.04));
  const hIY=Math.round(H*.035)+bRy,hAY=DY-bRy-1.5;
  const eT=DY+BH+1,eB=H-Math.round(H*.035);
  const L=document.body.classList.contains('light');
  const bIF="#f4d03f",bIS="#c4a000";
  const bAF=L?"#1565c0":"#00e5a0",bAS=L?"#0d47a1":"#00b87a";
  const bAG=L?"rgba(21,101,192,.55)":"rgba(0,229,160,.55)";
  const dC=L?"#1565c0":"#00e5a0";
  let s='';
  s+=`<rect x="0" y="0" width="${W}" height="${H}" rx="11" fill="#5c3a00"/>`;
  s+=`<rect x="4" y="4" width="${W-8}" height="${H-8}" rx="8" fill="#3d2000"/>`;
  for(let g=0;g<22;g++){const gx=-3+g*(W/14);
    s+=`<line x1="${gx}" y1="4" x2="${gx+9}" y2="${H-4}" stroke="#fff" stroke-width="0.18" opacity="0.032"/>`}
  s+=`<rect x="3" y="${DY}" width="${W-6}" height="${BH}" rx="3.5" fill="#c8962e"/>`;
  s+=`<rect x="3" y="${DY+1.5}" width="${W-6}" height="2" rx="1" fill="#fff" opacity="0.2"/>`;
  s+=`<rect x="3" y="${DY+BH-2}" width="${W-6}" height="1.5" rx="0.5" fill="#000" opacity="0.13"/>`;
  ab.forEach((col,ci)=>{
    const x=ci*cW+cW/2,hA=col.h,dFS=Math.max(4,Math.min(8,cW*.27));
    s+=`<line x1="${x}" y1="${H*.024}" x2="${x}" y2="${DY}" stroke="#6b3a00" stroke-width="1.5" stroke-linecap="round"/>`;
    s+=`<line x1="${x}" y1="${DY+BH}" x2="${x}" y2="${H*.976}" stroke="#6b3a00" stroke-width="1.5" stroke-linecap="round"/>`;
    s+=`<line x1="${x+.4}" y1="${H*.024}" x2="${x+.4}" y2="${DY}" stroke="#fff" stroke-width=".3" opacity=".1" stroke-linecap="round"/>`;
    s+=`<line x1="${x+.4}" y1="${DY+BH}" x2="${x+.4}" y2="${H*.976}" stroke="#fff" stroke-width=".3" opacity=".1" stroke-linecap="round"/>`;
    const hy=hA?hAY:hIY;
    const hF=hA?bAF:bIF,hS=hA?bAS:bIS;
    s+=`<g onclick="togH(${ci})" style="cursor:pointer">`;
    s+=`<ellipse cx="${x}" cy="${hy}" rx="${bRx}" ry="${bRy}" fill="${hF}" stroke="${hS}" stroke-width="1"${hA?` filter="drop-shadow(0 0 4px ${bAG})"`:''}/>`; 
    s+=`<ellipse cx="${x-bRx*.24}" cy="${hy-bRy*.36}" rx="${bRx*.21}" ry="${bRy*.18}" fill="#fff" opacity=".22" pointer-events="none"/>`;
    s+=`</g>`;
    const inact=[];for(let j=0;j<4;j++)if(!col.e[j])inact.push(j);
    for(let bi=0;bi<4;bi++){
      const act=col.e[bi];
      const by=act?eT+bRy+bi*bGap:eB-bRy-(inact.length-1-inact.indexOf(bi))*bGap;
      const eF=act?bAF:bIF,eS=act?bAS:bIS;
      s+=`<g onclick="togE(${ci},${bi})" style="cursor:pointer">`;
      s+=`<ellipse cx="${x}" cy="${by}" rx="${bRx}" ry="${bRy}" fill="${eF}" stroke="${eS}" stroke-width="1"${act?` filter="drop-shadow(0 0 4px ${bAG})"`:''}/>`; 
      s+=`<ellipse cx="${x-bRx*.24}" cy="${by-bRy*.36}" rx="${bRx*.21}" ry="${bRy*.18}" fill="#fff" opacity=".22" pointer-events="none"/>`;
      s+=`</g>`;
    }
    const dv=cv(col);
    s+=`<text x="${x}" y="${H-1}" text-anchor="middle" font-size="${dFS}" font-weight="700" fill="${dv>0?dC:'#252b3d'}">${dv}</text>`;
  });
  const svg=document.getElementById(svgId);
  if(!svg)return;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.innerHTML=s;
}
function buildLabels(wId,lId){
  const w=document.getElementById(wId),l=document.getElementById(lId);
  if(!w||!l||w.offsetWidth<10)return;
  const lb=getL();
  const fs=Math.max(5,Math.min(9.5,w.offsetWidth/RODS/3.1));
  let h='';
  lb.forEach((lx,i)=>{h+=`<div class="plbl" style="font-size:${fs}px;color:${i===RODS-1?'var(--acc)':'var(--txm)'}">${lx}</div>`});
  l.innerHTML=h;
}
function buildBoth(){
  const desk=window.innerWidth>=680;
  if(desk){const dw=document.getElementById('daw');if(dw&&dw.offsetWidth>10&&dw.offsetHeight>10){drawSVG('das',dw.offsetWidth,dw.offsetHeight);buildLabels('daw','dpl')}}
  else{const mw=document.getElementById('maw');if(mw&&mw.offsetWidth>10&&mw.offsetHeight>10){drawSVG('mas',mw.offsetWidth,mw.offsetHeight);buildLabels('maw','mpl')}}
}
function setR(r){
  r=Math.max(3,Math.min(21,r));RODS=r;ab=init();
  ['mrc','drc'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=r});
  ['mrl','drl'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=r});
  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('sel',parseInt(b.dataset.r)===r));
  clr();
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
document.getElementById('tgl').addEventListener('click',()=>{
  dark=!dark;document.body.classList.toggle('light',!dark);
  document.getElementById('tglk').textContent=dark?'🌙':'☀️';buildBoth();
});
document.querySelectorAll('.rb[data-r]').forEach(b=>b.addEventListener('click',()=>setR(parseInt(b.dataset.r))));
document.getElementById('mrc').addEventListener('change',e=>setR(parseInt(e.target.value)||13));
document.getElementById('drc').addEventListener('change',e=>setR(parseInt(e.target.value)||13));
let rsz;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(buildBoth,55)});

// ── INIT ─────────────────────────────────────────────────────────────────────
rdsp(0);
requestAnimationFrame(()=>requestAnimationFrame(buildBoth));
</script>
</body>
